name: OddsHunter VPS Result Backlog Hotfix

on:
  workflow_dispatch:
  push:
    branches:
      - codex/fix-autonomous-result-backlog
    paths:
      - stage5_complete_fixture_analysis_patch.py
      - fixture_analysis_queue.py
      - cloud_live_status_sync.py
      - provider_fixture_catalog.py
      - stage8_daemon_runtime_patch.py
      - .github/workflows/oddshunter-vps-result-backlog-hotfix.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify runtime package
        run: |
          set -euo pipefail
          test -f ODDSHUNTER_CLOUD_LINUX_STAGE4_STAGE5_V4.zip
          test "$(sha256sum ODDSHUNTER_CLOUD_LINUX_STAGE4_STAGE5_V4.zip | awk '{print toupper($1)}')" = "B6040348D77A3A122A03BCEAE0EC7406D5FBA06DD2B4B52A201DB1241C975232"
          unzip -p ODDSHUNTER_CLOUD_LINUX_STAGE4_STAGE5_V4.zip global_team_workflow.py > /tmp/global_team_workflow.py
          unzip -p ODDSHUNTER_CLOUD_LINUX_STAGE4_STAGE5_V4.zip cloud_stage5_cycle.py > /tmp/cloud_stage5_cycle.py
          python stage5_complete_fixture_analysis_patch.py /tmp/cloud_stage5_cycle.py /tmp/cloud_stage5_cycle.complete.py
          python -m py_compile /tmp/global_team_workflow.py /tmp/cloud_stage5_cycle.complete.py fixture_analysis_queue.py
          unzip -p ODDSHUNTER_CLOUD_STAGE8_VPS_24X7_V1_3.zip stage8_daemon.py > /tmp/stage8_daemon.py
          python stage8_daemon_runtime_patch.py /tmp/stage8_daemon.py
          python -m py_compile /tmp/stage8_daemon.py
          python /tmp/stage8_daemon.py --self-test
          grep -F 'OH_STAGE8_IDLE_STAGE5_OK_V1' /tmp/stage8_daemon.py >/dev/null
          grep -F 'finished_schedule_matches(key)' /tmp/global_team_workflow.py >/dev/null
          grep -F 'ODDSHUNTER_RESULT_SYNC_TARGETS_PER_CYCLE' /tmp/cloud_stage5_cycle.complete.py >/dev/null
          grep -F 'select_pending_fixture_analyses' /tmp/cloud_stage5_cycle.complete.py >/dev/null
          echo '===== STAGE5 PASS/CRITERIA SOURCE ====='
          grep -n -E 'stage5_pass|future_analysis_target_at_least_1|future_analysis_full_at_least_1|shots_future_pass_at_least_1|sync_candidate_pool_at_least_10|result_sync_targets_at_least_1|result_sync_committed_at_least_1' /tmp/cloud_stage5_cycle.complete.py || true

      - name: Verify VPS secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${VPS_HOST:-}"
          test -n "${VPS_USER:-}"
          test -n "${VPS_SSH_PRIVATE_KEY:-}"

      - name: Prepare SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_PORT_SECRET: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          PORT="${VPS_PORT_SECRET:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/oddshunter_hotfix
          chmod 600 ~/.ssh/oddshunter_hotfix
          ssh-keygen -y -f ~/.ssh/oddshunter_hotfix >/dev/null
          ssh-keyscan -p "$PORT" -H "$VPS_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          echo "VPS_PORT=$PORT" >> "$GITHUB_ENV"

      - name: Deploy workflow fix and restart daemon
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          SSH=(ssh -i ~/.ssh/oddshunter_hotfix -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST")
          SCP=(scp -i ~/.ssh/oddshunter_hotfix -P "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          REMOTE_DIR="$("${SSH[@]}" 'mktemp -d /tmp/oddshunter-hotfix.XXXXXX')"
          trap '"${SSH[@]}" "rm -rf \"$REMOTE_DIR\"" || true' EXIT
          "${SCP[@]}" /tmp/global_team_workflow.py "$VPS_USER@$VPS_HOST:$REMOTE_DIR/global_team_workflow.py"
          "${SCP[@]}" /tmp/cloud_stage5_cycle.complete.py "$VPS_USER@$VPS_HOST:$REMOTE_DIR/cloud_stage5_cycle.py"
          "${SCP[@]}" fixture_analysis_queue.py "$VPS_USER@$VPS_HOST:$REMOTE_DIR/fixture_analysis_queue.py"
          "${SCP[@]}" cloud_live_status_sync.py "$VPS_USER@$VPS_HOST:$REMOTE_DIR/cloud_live_status_sync.py"
          "${SCP[@]}" provider_fixture_catalog.py "$VPS_USER@$VPS_HOST:$REMOTE_DIR/provider_fixture_catalog.py"
          "${SCP[@]}" stage8_daemon_runtime_patch.py "$VPS_USER@$VPS_HOST:$REMOTE_DIR/stage8_daemon_runtime_patch.py"

          "${SSH[@]}" bash -s -- "$REMOTE_DIR" <<'REMOTE'
          set -euo pipefail
          REMOTE_DIR="$1"
          if [ "$(id -u)" -eq 0 ]; then SUDO=(); else SUDO=(sudo -n); fi
          CURRENT="$(readlink -f /opt/oddshunter/current)"
          test -n "$CURRENT"
          test -f "$CURRENT/global_team_workflow.py"
          "${SUDO[@]}" install -d -m 0750 -o oddshunter -g oddshunter /var/lib/oddshunter/artifacts/hotfix-backups
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          "${SUDO[@]}" cp -a "$CURRENT/global_team_workflow.py" "/var/lib/oddshunter/artifacts/hotfix-backups/global_team_workflow.py.$STAMP"
          "${SUDO[@]}" cp -a "$CURRENT/cloud_stage5_cycle.py" "/var/lib/oddshunter/artifacts/hotfix-backups/cloud_stage5_cycle.py.$STAMP"
          "${SUDO[@]}" cp -a "$CURRENT/cloud_live_status_sync.py" "/var/lib/oddshunter/artifacts/hotfix-backups/cloud_live_status_sync.py.$STAMP"
          "${SUDO[@]}" cp -a "$CURRENT/stage8_daemon.py" "/var/lib/oddshunter/artifacts/hotfix-backups/stage8_daemon.py.$STAMP"
          "${SUDO[@]}" install -m 0644 -o oddshunter -g oddshunter "$REMOTE_DIR/global_team_workflow.py" "$CURRENT/global_team_workflow.py.new"
          "${SUDO[@]}" install -m 0644 -o oddshunter -g oddshunter "$REMOTE_DIR/cloud_stage5_cycle.py" "$CURRENT/cloud_stage5_cycle.py.new"
          "${SUDO[@]}" install -m 0644 -o oddshunter -g oddshunter "$REMOTE_DIR/fixture_analysis_queue.py" "$CURRENT/fixture_analysis_queue.py.new"
          "${SUDO[@]}" "$CURRENT/.venv-cloud/bin/python" -m py_compile "$CURRENT/global_team_workflow.py.new" "$CURRENT/cloud_stage5_cycle.py.new" "$CURRENT/fixture_analysis_queue.py.new"
          "${SUDO[@]}" mv "$CURRENT/global_team_workflow.py.new" "$CURRENT/global_team_workflow.py"
          "${SUDO[@]}" mv "$CURRENT/cloud_stage5_cycle.py.new" "$CURRENT/cloud_stage5_cycle.py"
          "${SUDO[@]}" mv "$CURRENT/fixture_analysis_queue.py.new" "$CURRENT/fixture_analysis_queue.py"
          "${SUDO[@]}" install -m 0644 -o oddshunter -g oddshunter "$REMOTE_DIR/cloud_live_status_sync.py" "$CURRENT/cloud_live_status_sync.py"
          "${SUDO[@]}" install -m 0644 -o oddshunter -g oddshunter "$REMOTE_DIR/provider_fixture_catalog.py" "$CURRENT/provider_fixture_catalog.py"
          "${SUDO[@]}" "$CURRENT/.venv-cloud/bin/python" -m py_compile "$CURRENT/cloud_live_status_sync.py"
          "${SUDO[@]}" "$CURRENT/.venv-cloud/bin/python" "$REMOTE_DIR/stage8_daemon_runtime_patch.py" "$CURRENT/stage8_daemon.py"
          "${SUDO[@]}" "$CURRENT/.venv-cloud/bin/python" -m py_compile "$CURRENT/stage8_daemon.py"
          "${SUDO[@]}" "$CURRENT/.venv-cloud/bin/python" "$CURRENT/stage8_daemon.py" --self-test
          grep -F 'OH_STAGE8_IDLE_STAGE5_OK_V1' "$CURRENT/stage8_daemon.py" >/dev/null
          grep -F 'finished_schedule_matches(key)' "$CURRENT/global_team_workflow.py" >/dev/null
          grep -F 'ODDSHUNTER_RESULT_SYNC_TARGETS_PER_CYCLE' "$CURRENT/cloud_stage5_cycle.py" >/dev/null
          grep -F 'select_pending_fixture_analyses' "$CURRENT/cloud_stage5_cycle.py" >/dev/null
          "${SUDO[@]}" install -d -m 0755 /etc/systemd/system/oddshunter.service.d
          printf '%s\n' \
            '[Service]' \
            'Environment=ODDSHUNTER_ANALYSIS_TARGET_LIMIT=8' \
            'Environment=ODDSHUNTER_ANALYSIS_GRACE_MINUTES=4320' | \
            "${SUDO[@]}" tee /etc/systemd/system/oddshunter.service.d/complete-three-day-analysis.conf >/dev/null
          "${SUDO[@]}" systemctl daemon-reload
          "${SUDO[@]}" systemctl enable --now oddshunter-live-sync.timer oddshunter-schedule-refresh.timer
          "${SUDO[@]}" systemctl start --no-block oddshunter-live-sync.service
          "${SUDO[@]}" systemctl restart oddshunter.service
          "${SUDO[@]}" systemctl start --no-block oddshunter-schedule-refresh.service
          sleep 8
          "${SUDO[@]}" systemctl is-active --quiet oddshunter.service
          "${SUDO[@]}" systemctl --no-pager --full status oddshunter.service | sed -n '1,12p'
          echo "VPS_THREE_DAY_ANALYSIS_HOTFIX=PASS"
          REMOTE
