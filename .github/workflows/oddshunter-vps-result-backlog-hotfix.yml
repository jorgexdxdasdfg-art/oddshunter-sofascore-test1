name: OddsHunter VPS Result Backlog Hotfix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify runtime package
        run: |
          set -euo pipefail
          test -f ODDSHUNTER_CLOUD_LINUX_STAGE4_STAGE5_V4.zip
          test "$(sha256sum ODDSHUNTER_CLOUD_LINUX_STAGE4_STAGE5_V4.zip | awk '{print toupper($1)}')" = "DCDBBCC2BB86835EE488737265E8445BA24C1AE9BFC4EFB5E18EDDC91D0590B1"
          unzip -p ODDSHUNTER_CLOUD_LINUX_STAGE4_STAGE5_V4.zip global_team_workflow.py > /tmp/global_team_workflow.py
          python -m py_compile /tmp/global_team_workflow.py
          grep -F 'finished_schedule_matches(key)' /tmp/global_team_workflow.py >/dev/null

      - name: Verify VPS secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${VPS_HOST:-}"
          test -n "${VPS_USER:-}"
          test -n "${VPS_SSH_PRIVATE_KEY:-}"

      - name: Prepare SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_PORT_SECRET: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          PORT="${VPS_PORT_SECRET:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/oddshunter_hotfix
          chmod 600 ~/.ssh/oddshunter_hotfix
          ssh-keygen -y -f ~/.ssh/oddshunter_hotfix >/dev/null
          ssh-keyscan -p "$PORT" -H "$VPS_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          echo "VPS_PORT=$PORT" >> "$GITHUB_ENV"

      - name: Deploy workflow fix and restart daemon
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          SSH=(ssh -i ~/.ssh/oddshunter_hotfix -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST")
          SCP=(scp -i ~/.ssh/oddshunter_hotfix -P "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          REMOTE_DIR="$("${SSH[@]}" 'mktemp -d /tmp/oddshunter-hotfix.XXXXXX')"
          trap '"${SSH[@]}" "rm -rf \"$REMOTE_DIR\"" || true' EXIT
          "${SCP[@]}" /tmp/global_team_workflow.py "$VPS_USER@$VPS_HOST:$REMOTE_DIR/global_team_workflow.py"

          "${SSH[@]}" bash -s -- "$REMOTE_DIR" <<'REMOTE'
          set -euo pipefail
          REMOTE_DIR="$1"
          if [ "$(id -u)" -eq 0 ]; then SUDO=(); else SUDO=(sudo -n); fi
          CURRENT="$(readlink -f /opt/oddshunter/current)"
          test -n "$CURRENT"
          test -f "$CURRENT/global_team_workflow.py"
          "${SUDO[@]}" install -d -m 0750 -o oddshunter -g oddshunter /var/lib/oddshunter/artifacts/hotfix-backups
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          "${SUDO[@]}" cp -a "$CURRENT/global_team_workflow.py" "/var/lib/oddshunter/artifacts/hotfix-backups/global_team_workflow.py.$STAMP"
          "${SUDO[@]}" install -m 0644 -o oddshunter -g oddshunter "$REMOTE_DIR/global_team_workflow.py" "$CURRENT/global_team_workflow.py.new"
          "${SUDO[@]}" "$CURRENT/.venv-cloud/bin/python" -m py_compile "$CURRENT/global_team_workflow.py.new"
          "${SUDO[@]}" mv "$CURRENT/global_team_workflow.py.new" "$CURRENT/global_team_workflow.py"
          grep -F 'finished_schedule_matches(key)' "$CURRENT/global_team_workflow.py" >/dev/null
          "${SUDO[@]}" systemctl restart oddshunter.service
          sleep 8
          "${SUDO[@]}" systemctl is-active --quiet oddshunter.service
          "${SUDO[@]}" systemctl --no-pager --full status oddshunter.service | sed -n '1,12p'
          echo "VPS_RESULT_BACKLOG_HOTFIX=PASS"
          REMOTE
