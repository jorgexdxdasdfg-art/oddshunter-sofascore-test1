name: Test Result Hotfix TEMP

on:
  push:
    branches:
      - codex/fix-autonomous-result-backlog
    paths:
      - .github/workflows/inspect-stage8-daemon-temp.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run focused tests
        run: |
          set -euo pipefail
          python -m pip install --quiet pytest
          python -m py_compile cloud_live_status_sync.py stage5_complete_fixture_analysis_patch.py stage8_daemon_runtime_patch.py
          python -m pytest -q tests/test_cloud_live_status_sync.py tests/test_fixture_analysis_queue.py

