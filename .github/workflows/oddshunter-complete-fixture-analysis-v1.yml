name: OddsHunter Complete Fixture Analysis V1
# Publishes the provider-complete calendar before draining analysis work.

on:
  push:
    branches: [main]
    paths:
      - fixture_analysis_queue.py
      - stage5_complete_fixture_analysis_patch.py
      - tests/test_fixture_analysis_queue.py
      - .github/workflows/oddshunter-complete-fixture-analysis-v1.yml
      - mobile_schedule_seed_builder.py
      - deploy/mobile_schedule_catalog_seed.json.gz
      - deploy/mobile_schedule_bootstrap.json.gz
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Validate analysis queue
        run: |
          set -euo pipefail
          python -m pip install --quiet pytest
          python -m pytest -q tests/test_fixture_analysis_queue.py
          python -m py_compile fixture_analysis_queue.py stage5_complete_fixture_analysis_patch.py \
            cloud_schedule_refresh.py mobile_schedule_seed_builder.py cloud_live_status_sync.py

      - name: Prepare SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_PORT_SECRET: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          test -n "${VPS_HOST:-}"
          test -n "${VPS_SSH_PRIVATE_KEY:-}"
          PORT="${VPS_PORT_SECRET:-22}"
          echo "VPS_PORT=$PORT" >> "$GITHUB_ENV"
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/oddshunter_analysis
          chmod 0600 ~/.ssh/oddshunter_analysis
          ssh-keyscan -p "$PORT" -H "$VPS_HOST" > ~/.ssh/known_hosts

      - name: Install complete fixture queue
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          SCP=(scp -i ~/.ssh/oddshunter_analysis -P "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          SSH=(ssh -i ~/.ssh/oddshunter_analysis -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST")
          "${SCP[@]}" fixture_analysis_queue.py stage5_complete_fixture_analysis_patch.py \
            cloud_schedule_refresh.py mobile_schedule_seed_builder.py cloud_live_status_sync.py \
            deploy/mobile_schedule_catalog_seed.json.gz \
            deploy/mobile_schedule_bootstrap.json.gz \
            "$VPS_USER@$VPS_HOST:/tmp/"
          "${SSH[@]}" 'bash -s' <<'REMOTE'
          set -eEuo pipefail
          trap 'echo "::error title=Remote fixture queue install failed::line=$LINENO command=$BASH_COMMAND"' ERR
          if [ "$(id -u)" -eq 0 ]; then SUDO=""; else SUDO="sudo -n"; fi
          CUR="$(readlink -f /opt/oddshunter/current)"
          PY="$CUR/.venv-cloud/bin/python"
          TARGET="$CUR/cloud_stage5_cycle.py"
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          BACKUP="$TARGET.PRE_COMPLETE_FIXTURE_ANALYSIS_$STAMP"
          $SUDO cp -a "$TARGET" "$BACKUP"
          $SUDO -u oddshunter "$PY" /tmp/stage5_complete_fixture_analysis_patch.py "$TARGET" /tmp/cloud_stage5_cycle.complete.py
          $SUDO -u oddshunter "$PY" -m py_compile /tmp/cloud_stage5_cycle.complete.py /tmp/fixture_analysis_queue.py
          $SUDO install -o oddshunter -g oddshunter -m 0644 /tmp/cloud_stage5_cycle.complete.py "$TARGET"
          $SUDO install -o oddshunter -g oddshunter -m 0644 /tmp/fixture_analysis_queue.py "$CUR/fixture_analysis_queue.py"
          $SUDO install -o oddshunter -g oddshunter -m 0644 /tmp/cloud_schedule_refresh.py "$CUR/cloud_schedule_refresh.py"
          $SUDO install -o oddshunter -g oddshunter -m 0644 /tmp/mobile_schedule_seed_builder.py "$CUR/mobile_schedule_seed_builder.py"
          $SUDO install -o oddshunter -g oddshunter -m 0644 /tmp/cloud_live_status_sync.py "$CUR/cloud_live_status_sync.py"
          # Bootstrap the VPS with the same three-day catalog and analysis
          # documents used by Desktop. The normal refresh merges into this
          # snapshot, so a partial provider/database cycle cannot shrink a day.
          $SUDO install -o oddshunter -g oddshunter -m 0644 \
            /tmp/mobile_schedule_catalog_seed.json.gz \
            /var/lib/oddshunter/data/mobile_schedule_catalog_seed.json.gz
          $SUDO install -o oddshunter -g oddshunter -m 0644 \
            /tmp/mobile_schedule_bootstrap.json.gz \
            /var/lib/oddshunter/data/mobile_schedule_bootstrap.json.gz
          grep -q 'ODDSHUNTER_ANALYSIS_TARGET_LIMIT' "$TARGET"
          grep -q 'select_pending_fixture_analyses' "$TARGET"
          # Refresh the exact provider fixture catalog first.  This is the same
          # non-odds schedule flow used by Desktop and makes every discovered
          # fixture available to both Mobile and the analysis queue.
          $SUDO systemctl stop oddshunter-schedule-refresh.service || true
          if ! $SUDO systemctl start oddshunter-schedule-refresh.service; then
            $SUDO journalctl -u oddshunter-schedule-refresh.service -n 160 --no-pager
            exit 51
          fi
          $SUDO -u oddshunter "$PY" - "$CUR/data/automation/cloud_schedule_refresh/last.json" <<'PY'
          import json,sys
          from datetime import datetime,timedelta,timezone
          with open(sys.argv[1],encoding="utf-8") as handle:
              report=json.load(handle)
          today=datetime.now(timezone.utc).astimezone(timezone(timedelta(hours=-5))).date().isoformat()
          if report.get("result") != "PUBLISHED":
              raise SystemExit("PROVIDER_SCHEDULE_NOT_PUBLISHED=FAIL")
          count=int((report.get("counts_by_day") or {}).get(today) or 0)
          print("PROVIDER_SCHEDULE_TODAY="+str(count))
          if count <= 0:
              raise SystemExit("PROVIDER_SCHEDULE_TODAY_EMPTY=FAIL")
          PY
          # USL_FAMILY_REPAIR_V1
          # Corrige exclusivamente metadata de competici?n.
          # NO modifica ratings, probabilidades, pesos ni modelos.
          $SUDO -u oddshunter "$PY" - "$CUR" <<'PY'
          import json
          import sqlite3
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          sys.path.insert(0, str(root))

          import ratings

          db = root / "data" / "oddshunter.db"

          con = sqlite3.connect(db, timeout=30)
          con.row_factory = sqlite3.Row
          con.execute("PRAGMA busy_timeout=30000")

          expected_ids = {17677, 17678, 17679, 17680}

          before = con.execute(
              """
              SELECT
                  league_id,
                  name,
                  competition_family,
                  source_tournament_id
              FROM leagues
              WHERE league_id IN (17677,17678,17679,17680)
              ORDER BY league_id
              """
          ).fetchall()

          print(
              "USL_FAMILY_BEFORE="
              + json.dumps(
                  [dict(row) for row in before],
                  ensure_ascii=False,
              )
          )

          found_ids = {
              int(row["league_id"])
              for row in before
          }

          if found_ids != expected_ids:
              raise SystemExit(
                  "USL_FAMILY_ROWS_INCOMPLETE="
                  + str(sorted(found_ids))
              )

          for row in before:
              if int(row["source_tournament_id"] or 0) != 13363:
                  raise SystemExit(
                      "USL_SOURCE_TOURNAMENT_MISMATCH="
                      + str(dict(row))
                  )

              if str(row["name"] or "") != "USL Championship":
                  raise SystemExit(
                      "USL_NAME_MISMATCH="
                      + str(dict(row))
                  )

          con.execute(
              """
              UPDATE leagues
              SET competition_family='DOMESTIC'
              WHERE league_id IN (17677,17678,17679,17680)
                AND source_tournament_id=13363
                AND name='USL Championship'
              """
          )

          con.commit()

          after = con.execute(
              """
              SELECT
                  league_id,
                  name,
                  competition_family,
                  source_tournament_id
              FROM leagues
              WHERE league_id IN (17677,17678,17679,17680)
              ORDER BY league_id
              """
          ).fetchall()

          print(
              "USL_FAMILY_AFTER="
              + json.dumps(
                  [dict(row) for row in after],
                  ensure_ascii=False,
              )
          )

          if len(after) != 4 or any(
              str(row["competition_family"] or "").upper()
              != "DOMESTIC"
              for row in after
          ):
              raise SystemExit("USL_FAMILY_REPAIR_VERIFY=FAIL")

          targets = (
              (
                  197065,
                  "Colorado Springs Switchbacks FC",
                  "2026-09-12T02:00:00+00:00",
              ),
              (
                  217134,
                  "San Antonio FC",
                  "2026-09-12T02:00:00+00:00",
              ),
              (
                  310531,
                  "New Mexico United",
                  "2026-09-12T01:30:00+00:00",
              ),
              (
                  148992,
                  "Indy Eleven",
                  "2026-09-12T01:30:00+00:00",
              ),
          )

          for sid, name, kickoff_before in targets:
              scope = ratings.domestic_history_scope(
                  con,
                  sid,
              )

              history = ratings.obtener_ultimos_partidos(
                  con,
                  sofascore_id=sid,
                  limite=100,
                  league_ids=scope,
                  kickoff_before=kickoff_before,
              )

              print(
                  "USL_HISTORY_VERIFY",
                  {
                      "sid": sid,
                      "name": name,
                      "scope": scope,
                      "history_count": len(history),
                  },
              )

              if not history:
                  raise SystemExit(
                      "USL_HISTORY_STILL_EMPTY="
                      + str(sid)
                  )

          con.close()

          print("USL_FAMILY_REPAIR=PASS")
          PY

          # Rescate temporal: solo los cinco fixtures recuperados.
          # Se elimina autom?ticamente al terminar este workflow.
          $SUDO install -d -m 0755 /run/systemd/system/oddshunter.service.d
          $SUDO tee /run/systemd/system/oddshunter.service.d/mobile-analysis-rescue.conf >/dev/null <<'UNIT'
          [Service]
          Environment=ODDSHUNTER_ANALYSIS_TARGET_LIMIT=5
          Environment=ODDSHUNTER_ANALYSIS_GRACE_MINUTES=4320
          Environment=ODDSHUNTER_ANALYSIS_PRIORITY_EVENT_IDS=15285834,15285843,16317939,16361914,16483673
          UNIT
          $SUDO systemctl daemon-reload

          # Evidencia de c?mo el VPS mapea las ligas recuperadas.
          $SUDO -u oddshunter "$PY" - "$CUR/data/competitions.json" <<'PY'
          import json,sys
          document=json.load(open(sys.argv[1],encoding="utf-8-sig"))
          wanted={17680,407,1815,3283}
          for row in document.get("competitions",[]):
              if isinstance(row,dict) and int(row.get("league_id") or 0) in wanted:
                  print("RESCUE_REGISTRY =",{
                      "league_id":row.get("league_id"),
                      "key":row.get("key"),
                      "name":row.get("name"),
                      "active":row.get("active"),
                  })
          PY

          date -u +%s | $SUDO tee /tmp/oddshunter_complete_analysis_epoch >/dev/null
          $SUDO systemctl restart oddshunter.service
          $SUDO systemctl is-active --quiet oddshunter.service
          echo COMPLETE_FIXTURE_QUEUE_INSTALL=PASS
          echo BACKUP="$BACKUP"
          REMOTE

      - name: Drain rescued fixture analysis and republish
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          SSH=(ssh -i ~/.ssh/oddshunter_analysis -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST")

          "${SSH[@]}" 'bash -s' <<'REMOTE'
          set -eEuo pipefail

          if [ "$(id -u)" -eq 0 ]; then SUDO=""; else SUDO="sudo -n"; fi
          CUR="$(readlink -f /opt/oddshunter/current)"
          PY="$CUR/.venv-cloud/bin/python"
          TARGET_IDS="15285834,15285843,16317939,16361914,16483673"
          DROPIN="/run/systemd/system/oddshunter.service.d/mobile-analysis-rescue.conf"

          cleanup() {
            echo "RESTORING_NORMAL_ANALYSIS_SERVICE=YES"
            $SUDO rm -f "$DROPIN" || true
            $SUDO systemctl daemon-reload || true
            $SUDO systemctl restart oddshunter.service || true
          }
          trap cleanup EXIT

          ready=0

          for attempt in $(seq 1 72); do
            if [ "$($SUDO systemctl is-active oddshunter.service 2>/dev/null || true)" != "active" ]; then
              echo "ANALYSIS_SERVICE_INACTIVE=FAIL"
              $SUDO journalctl -u oddshunter.service -n 300 --no-pager || true
              exit 61
            fi

            STATUS="$(
              $SUDO -u oddshunter "$PY" - "$CUR" "$TARGET_IDS" <<'PY'
          import json
          import sys
          from pathlib import Path

          root=Path(sys.argv[1])
          targets=[int(value) for value in sys.argv[2].split(",") if value]
          sys.path.insert(0,str(root))

          from fixture_analysis_queue import has_visible_characteristics

          analysis_root=root/"data"/"analisis"
          ready={}

          for event_id in targets:
              keys=[]
              for folder in analysis_root.glob(f"*/{event_id}"):
                  key=folder.parent.name
                  if has_visible_characteristics(
                      analysis_root,key,event_id
                  ):
                      keys.append(key)
              ready[event_id]=sorted(keys)

          print(
              "TARGET_ANALYSIS_STATUS="
              + json.dumps(ready,ensure_ascii=False,sort_keys=True)
          )

          if all(ready[event_id] for event_id in targets):
              print("TARGET_ANALYSIS_READY=PASS")
          else:
              print("TARGET_ANALYSIS_READY=WAIT")
          PY
            )"

            echo "$STATUS"

            if grep -q "TARGET_ANALYSIS_READY=PASS" <<<"$STATUS"; then
              ready=1
              break
            fi

            EPOCH="$(cat /tmp/oddshunter_complete_analysis_epoch 2>/dev/null || echo 0)"
            FAIL_LINE="$(
              $SUDO journalctl -u oddshunter.service --since "@$EPOCH" --no-pager 2>/dev/null |
                grep -E "CYCLE=[0-9]+ FAIL" |
                tail -n 1 || true
            )"

            if [ -n "$FAIL_LINE" ] && ! grep -q "Stage5 rc=-15" <<<"$FAIL_LINE"; then
              echo "ANALYSIS_CYCLE_FAIL=$FAIL_LINE"
              echo "========== TARGET FAILURE JOURNAL =========="
              $SUDO journalctl -u oddshunter.service --since "@$EPOCH" --no-pager -n 1200 |
                grep -Eia "15285834|15285843|16317939|16361914|16483673|ERROR|Traceback|exception|CYCLE=" ||
                true
              exit 62
            fi

            sleep 10
          done

          if [ "$ready" -ne 1 ]; then
            echo "TARGET_ANALYSIS_TIMEOUT=FAIL"

            echo "========== TARGET ANALYSIS FILE STATE =========="
            $SUDO -u oddshunter "$PY" - "$CUR" "$TARGET_IDS" <<'PY'
          import json
          import sys
          from pathlib import Path

          root=Path(sys.argv[1])
          targets=[int(value) for value in sys.argv[2].split(",") if value]
          analysis_root=root/"data"/"analisis"

          for event_id in targets:
              folders=list(analysis_root.glob(f"*/{event_id}"))
              print("TARGET",event_id,"FOLDERS",[str(x) for x in folders])
              for folder in folders:
                  for name in ("status.json","analysis.json"):
                      path=folder/name
                      if not path.is_file():
                          continue
                      try:
                          doc=json.loads(path.read_text(encoding="utf-8-sig"))
                          print(
                              "TARGET_DOC",
                              event_id,
                              folder.parent.name,
                              name,
                              {
                                  "status":doc.get("status"),
                                  "analysis_status":doc.get("analysis_status"),
                                  "error":doc.get("error"),
                                  "reason":doc.get("reason"),
                              },
                          )
                      except Exception as exc:
                          print("TARGET_DOC_ERROR",event_id,name,type(exc).__name__,str(exc))
          PY

            echo "========== STAGE5 REPORT =========="
            if [ -f "$CUR/artifacts/cloud_stage5_cycle.json" ]; then
              $SUDO -u oddshunter "$PY" - "$CUR/artifacts/cloud_stage5_cycle.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          for key in (
              "stage5_pass",
              "analysis_target_count",
              "analysis_result_counts",
              "criteria",
          ):
              print(key,"=",d.get(key))
          print(
              "analysis_targets=",
              json.dumps(
                  d.get("analysis_targets") or d.get("selected_analysis_targets") or [],
                  ensure_ascii=False,
              )[:12000],
          )
          PY
            fi

            EPOCH="$(cat /tmp/oddshunter_complete_analysis_epoch 2>/dev/null || echo 0)"
            echo "========== TARGET JOURNAL =========="
            $SUDO journalctl -u oddshunter.service --since "@$EPOCH" --no-pager -n 1800 |
              grep -Eia "15285834|15285843|16317939|16361914|16483673|ERROR|Traceback|exception|CYCLE=" ||
              true

            exit 63
          fi

          echo "TARGET_ANALYSIS_ALL=PASS"

          # Los documentos nuevos ya existen. Reconstruir/republicar el seed
          # para que Mobile deje de ver pending/ERROR.
          $SUDO systemctl stop oddshunter-schedule-refresh.service || true

          if ! $SUDO systemctl start oddshunter-schedule-refresh.service; then
            echo "POST_ANALYSIS_SCHEDULE_REFRESH=FAIL"
            $SUDO journalctl -u oddshunter-schedule-refresh.service -n 300 --no-pager || true
            exit 64
          fi

          echo "POST_ANALYSIS_SCHEDULE_REFRESH=PASS"

          $SUDO -u oddshunter "$PY" - "$CUR/data/automation/cloud_schedule_refresh/last.json" <<'PY'
          import json,sys
          report=json.load(open(sys.argv[1],encoding="utf-8"))
          print(
              "POST_ANALYSIS_REPORT="
              + json.dumps(report,ensure_ascii=False,separators=(",",":"))
          )
          if report.get("result") != "PUBLISHED":
              raise SystemExit("POST_ANALYSIS_PUBLICATION=FAIL")
          PY
          REMOTE

      - name: Verify every Mobile fixture has characteristics
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import time
          import urllib.request

          base="https://oddshunter-mobile.vercel.app/api/day?offset={}&limit=1000&cb={}"

          rescued={
              15285834:{
                  "competition_name":"USL Championship",
                  "home_team":"Colorado Springs Switchbacks FC",
                  "away_team":"San Antonio FC",
              },
              15285843:{
                  "competition_name":"USL Championship",
                  "home_team":"New Mexico United",
                  "away_team":"Indy Eleven",
              },
              16317939:{
                  "competition_name":"Liga MX",
                  "home_team":"Club Tijuana",
                  "away_team":"Quer?taro FC",
              },
              16361914:{
                  "competition_name":"Belgium Pro League",
                  "home_team":"KV Mechelen",
                  "away_team":"RSC Anderlecht",
              },
              16483673:{
                  "competition_name":"Trendyol S?per Lig",
                  "home_team":"Be?ikta? JK",
                  "away_team":"Erzurumspor FK",
              },
          }

          missing=[]
          metadata_errors=[]
          seen={}
          totals={}

          for offset in (-1,0,1):
              request=urllib.request.Request(
                  base.format(offset,time.time_ns()),
                  headers={"Cache-Control":"no-cache","User-Agent":"Mozilla/5.0"},
              )
              with urllib.request.urlopen(request,timeout=45) as response:
                  rows=json.load(response)

              totals[offset]=len(rows)

              for row in rows:
                  event_id=int(row.get("event_id") or 0)
                  headline=row.get("headline") or {}
                  values=(
                      headline.get("home_win"),
                      headline.get("draw"),
                      headline.get("away_win"),
                  )
                  status=str(row.get("status") or "").upper()
                  finished=status in {
                      "FT","AET","PEN","FINISHED","FINAL","ENDED"
                  }

                  if event_id in rescued:
                      seen[event_id]=row

                      if not all(value is not None for value in values):
                          missing.append({
                              "event_id":event_id,
                              "competition":row.get("competition_key"),
                              "home":row.get("home_team"),
                              "away":row.get("away_team"),
                              "status":row.get("status"),
                              "analysis_status":row.get("analysis_status"),
                          })

                      expected=rescued[event_id]
                      for field in (
                          "competition_name",
                          "home_team",
                          "away_team",
                      ):
                          if row.get(field) != expected[field]:
                              metadata_errors.append({
                                  "event_id":event_id,
                                  "field":field,
                                  "expected":expected[field],
                                  "actual":row.get(field),
                              })

                  elif offset >= 0 and not finished:
                      if not all(value is not None for value in values):
                          missing.append({
                              "event_id":event_id,
                              "competition":row.get("competition_key"),
                              "home":row.get("home_team"),
                              "away":row.get("away_team"),
                              "status":row.get("status"),
                              "analysis_status":row.get("analysis_status"),
                          })

          unseen=sorted(set(rescued)-set(seen))

          print("MOBILE_DAY_TOTALS="+json.dumps(totals,sort_keys=True))
          print("RESCUED_TARGETS="+json.dumps(seen,ensure_ascii=False,sort_keys=True))
          print("MISSING_CHARACTERISTICS="+json.dumps(missing,ensure_ascii=False))
          print("METADATA_ERRORS="+json.dumps(metadata_errors,ensure_ascii=False))
          print("UNSEEN_RESCUED="+json.dumps(unseen))

          if unseen:
              raise SystemExit("RESCUED_EVENTS_MISSING=FAIL")
          if metadata_errors:
              raise SystemExit("RESCUED_METADATA_GATE=FAIL")
          if missing:
              raise SystemExit("COMPLETE_FIXTURE_CHARACTERISTICS_GATE=FAIL")

          print("RECOVERED_FIXTURES_FULL=PASS")
          print("COMPLETE_FIXTURE_CHARACTERISTICS_GATE=PASS")
          PY

