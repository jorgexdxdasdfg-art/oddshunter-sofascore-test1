name: Inspect FotMob Today TEMP

on:
  push:
    branches:
      - codex/fix-autonomous-result-backlog
    paths:
      - .github/workflows/inspect-fotmob-today-temp.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect FotMob Sep 21 fixtures
        run: |
          python - <<'PY'
          import json, urllib.request
          url="https://www.fotmob.com/api/data/matches?date=20260921"
          req=urllib.request.Request(url,headers={
              "User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130 Safari/537.36",
              "Accept":"application/json,text/plain,*/*",
              "Referer":"https://www.fotmob.com/",
          })
          with urllib.request.urlopen(req,timeout=30) as r:
              doc=json.load(r)
          leagues=doc.get("leagues") or []
          print("LEAGUE_COUNT",len(leagues))
          for league in leagues:
              if not isinstance(league,dict): continue
              matches=league.get("matches") or []
              if not matches: continue
              print("LEAGUE",json.dumps({
                  "id":league.get("id"),
                  "name":league.get("name"),
                  "ccode":league.get("ccode"),
                  "parentLeagueId":league.get("parentLeagueId"),
                  "count":len(matches),
              },ensure_ascii=False))
              for m in matches:
                  h=m.get("home") or {}; a=m.get("away") or {}; st=m.get("status") or {}
                  print("MATCH",json.dumps({
                      "id":m.get("id"),
                      "utc":st.get("utcTime"),
                      "home":h.get("name"),
                      "away":a.get("name"),
                      "score":[h.get("score"),a.get("score")],
                      "finished":st.get("finished"),
                  },ensure_ascii=False))
          PY

      - name: Inspect SofaScore LigaPro exact fixture
        run: |
          python - <<'PY'
          import json, subprocess
          for direction in ("last","next"):
              for host in ("api.sofascore.com","www.sofascore.com"):
                  url=f"https://{host}/api/v1/unique-tournament/240/season/89674/events/{direction}/0"
                  try:
                      p=subprocess.run(["curl","-fsSL","--max-time","25",
                          "-H","Accept: application/json",
                          "-H","Referer: https://www.sofascore.com/",
                          "-H","User-Agent: Mozilla/5.0",url],
                          capture_output=True,text=True,timeout=30,check=True)
                      doc=json.loads(p.stdout)
                      print("SOFA_OK",host,direction,"count",len(doc.get("events",[])))
                      for e in doc.get("events",[]):
                          h=(e.get("homeTeam") or {}).get("name","")
                          a=(e.get("awayTeam") or {}).get("name","")
                          if "Manta" in h or "Manta" in a or "Orense" in h or "Orense" in a:
                              print("SOFA_MATCH",json.dumps(e,ensure_ascii=False)[:15000])
                      break
                  except Exception as exc:
                      print("SOFA_FAIL",host,direction,type(exc).__name__,str(exc)[:250])
          PY
# inspect-sofa-ligapro
