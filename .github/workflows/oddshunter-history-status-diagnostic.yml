name: OddsHunter HISTORY STATUS DIAGNOSTIC

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/oddshunter-history-status-diagnostic.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_PORT_SECRET: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail

          test -n "${VPS_HOST:-}"
          test -n "${VPS_SSH_PRIVATE_KEY:-}"

          PORT="${VPS_PORT_SECRET:-22}"
          echo "VPS_PORT=$PORT" >> "$GITHUB_ENV"

          install -d -m 0700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/oddshunter_history
          chmod 0600 ~/.ssh/oddshunter_history
          ssh-keyscan -p "$PORT" -H "$VPS_HOST" > ~/.ssh/known_hosts

      - name: Inspect target history statuses
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail

          SSH=(
            ssh
            -i ~/.ssh/oddshunter_history
            -p "$VPS_PORT"
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            "$VPS_USER@$VPS_HOST"
          )

          "${SSH[@]}" 'bash -s' <<'REMOTE'
          set -euo pipefail

          if [ "$(id -u)" -eq 0 ]; then
            SUDO=""
          else
            SUDO="sudo -n"
          fi

          CUR="$(readlink -f /opt/oddshunter/current)"
          PY="$CUR/.venv-cloud/bin/python"

          $SUDO -u oddshunter "$PY" - "$CUR" <<'PY'
          import sqlite3
          import sys
          from datetime import datetime, timedelta
          from pathlib import Path

          root = Path(sys.argv[1])
          sys.path.insert(0, str(root))

          import ratings

          db = root / "data" / "oddshunter.db"

          con = sqlite3.connect(db)
          con.row_factory = sqlite3.Row

          targets = (
              (197065, "Colorado Springs", "2026-09-12T02:00:00+00:00"),
              (217134, "San Antonio",      "2026-09-12T02:00:00+00:00"),
              (310531, "New Mexico",       "2026-09-12T01:30:00+00:00"),
              (148992, "Indy Eleven",      "2026-09-12T01:30:00+00:00"),
              (36525,  "Tijuana",          "2026-09-12T03:10:00+00:00"),
              (1951,   "Queretaro",        "2026-09-12T03:10:00+00:00"),
          )

          for sid, name, kickoff_before in targets:
              before = datetime.fromisoformat(kickoff_before)
              kickoff_from = (
                  before - timedelta(days=365)
              ).isoformat()

              scope = ratings.domestic_history_scope(
                  con,
                  sid,
              )

              no_scope = ratings.obtener_ultimos_partidos(
                  con,
                  sofascore_id=sid,
                  limite=100,
                  league_ids=None,
                  kickoff_before=kickoff_before,
              )

              scope_only = ratings.obtener_ultimos_partidos(
                  con,
                  sofascore_id=sid,
                  limite=100,
                  league_ids=scope,
                  kickoff_before=kickoff_before,
              )

              scope_year = ratings.obtener_ultimos_partidos(
                  con,
                  sofascore_id=sid,
                  limite=100,
                  league_ids=scope,
                  kickoff_from=kickoff_from,
                  kickoff_before=kickoff_before,
              )

              memberships = con.execute(
                  """
                  SELECT
                      m.league_id,
                      l.name,
                      l.competition_family,
                      l.source_tournament_id
                  FROM team_competition_memberships m
                  JOIN teams t
                    ON t.team_id=m.team_id
                  JOIN leagues l
                    ON l.league_id=m.league_id
                  WHERE t.sofascore_id=?
                  ORDER BY m.league_id
                  """,
                  (sid,),
              ).fetchall()

              print(
                  "RATINGS_SCOPE_DIAG",
                  {
                      "sid": sid,
                      "name": name,
                      "scope": scope,
                      "no_scope_count": len(no_scope),
                      "scope_count": len(scope_only),
                      "scope_365d_count": len(scope_year),
                      "kickoff_from": kickoff_from,
                      "kickoff_before": kickoff_before,
                      "memberships": [
                          tuple(row)
                          for row in memberships
                      ],
                  },
              )

          con.close()
          PY
          REMOTE
