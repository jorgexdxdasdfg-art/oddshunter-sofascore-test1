name: OddsHunter VERCEL FRONTEND LABEL V1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - vercel_frontend_mirror.py
      - vercel_source_recover.py
      - vercel_backend_data_patch.py
      - vercel_assets/**
      - .github/workflows/oddshunter-vercel-frontend-v1.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      PUBLIC_URL: https://oddshunter-mobile.vercel.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gate secretos y proyecto Vercel
        id: inspect
        run: |
          set -eEuo pipefail
          test -n "${VERCEL_TOKEN:-}"
          test -n "${VERCEL_PROJECT_ID:-}"
          test -n "${VERCEL_ORG_ID:-}"
          mkdir -p artifacts
          python - <<'PY'
          import json,os,urllib.parse,urllib.request

          # Normalize accidental surrounding whitespace copied with a secret.
          token=os.environ["VERCEL_TOKEN"].strip()
          project_id=os.environ["VERCEL_PROJECT_ID"].strip()
          team_id=os.environ["VERCEL_ORG_ID"].strip()
          if not token or not project_id or not team_id:
              raise SystemExit("EMPTY_VERCEL_SECRET_AFTER_NORMALIZATION")
          if any("\n" in value or "\r" in value for value in (token,project_id,team_id)):
              raise SystemExit("INVALID_INTERNAL_LINE_BREAK_IN_VERCEL_SECRET")
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as env_file:
              env_file.write(f"VERCEL_TOKEN={token}\n")
              env_file.write(f"VERCEL_PROJECT_ID={project_id}\n")
              env_file.write(f"VERCEL_ORG_ID={team_id}\n")
          headers={"Authorization":f"Bearer {token}","User-Agent":"OddsHunter-Vercel-Deploy/1.0"}

          def get(path,params=None):
              query=urllib.parse.urlencode({**(params or {}),"teamId":team_id})
              req=urllib.request.Request(
                  f"https://api.vercel.com{path}?{query}",headers=headers
              )
              with urllib.request.urlopen(req,timeout=45) as response:
                  return json.load(response)

          project=get(f"/v9/projects/{project_id}")
          if str(project.get("id")) != project_id:
              raise SystemExit("VERCEL_PROJECT_ID_MISMATCH")
          public_host=urllib.parse.urlsplit(os.environ["PUBLIC_URL"]).netloc
          current=get(f"/v13/deployments/{urllib.parse.quote(public_host,safe='')}")
          if current.get("readyState") != "READY" or not current.get("url"):
              raise SystemExit("PUBLIC_DEPLOYMENT_NOT_READY")
          if str(current.get("projectId")) != project_id:
              raise SystemExit("PUBLIC_DEPLOYMENT_PROJECT_MISMATCH")
          origin="https://"+str(current["url"]).strip("/")
          if origin.rstrip("/")==os.environ["PUBLIC_URL"].rstrip("/"):
              raise SystemExit("IMMUTABLE_ORIGIN_REQUIRED")
          safe={
              "project_id":project.get("id"),
              "project_name":project.get("name"),
              "framework":project.get("framework"),
              "root_directory":project.get("rootDirectory"),
              "deployment_id":current.get("uid"),
              "deployment_url":current.get("url"),
              "deployment_created":current.get("created"),
          }
          open("artifacts/vercel_inspect.json","w",encoding="utf-8").write(json.dumps(safe,indent=2))
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as fh:
              fh.write(f"origin={origin}\n")
              fh.write(f"deployment_id={current.get('uid') or current.get('id')}\n")
          print("VERCEL_SECRET_GATE=PASS")
          print("VERCEL_PROJECT_GATE=PASS name="+str(project.get("name")))
          print("IMMUTABLE_ORIGIN_GATE=PASS")
          PY

      - name: Recuperar fuente original y aplicar etiqueta
        env:
          DEPLOYMENT_ID: ${{ steps.inspect.outputs.deployment_id }}
        run: |
          set -eEuo pipefail
          python -m py_compile vercel_source_recover.py
          rm -rf vercel_source
          python vercel_source_recover.py \
            --deployment-id "$DEPLOYMENT_ID" \
            --team-id "$VERCEL_ORG_ID" \
            --output vercel_source \
            --manifest artifacts/vercel_source_manifest.json
          find vercel_source -maxdepth 3 -type f -printf '%P\n' | sort | head -100
          echo "ORIGINAL_SOURCE_RECOVERY=PASS"

      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest

      - name: Compilar preview de la fuente recuperada
        run: |
          set -eEuo pipefail
          PREVIEW_URL="$(vercel deploy --cwd vercel_source/src --yes --token "$VERCEL_TOKEN")"
          echo "PREVIEW_BUILD_URL=$PREVIEW_URL"
          echo "RECOVERED_SOURCE_PREVIEW_BUILD=PASS"

      - name: Desplegar producción y verificar
        env:
          ROLLBACK_URL: ${{ steps.inspect.outputs.origin }}
        run: |
          set -eEuo pipefail
          rollback_needed=0
          rollback_on_error() {
            status=$?
            if [ "$rollback_needed" = "1" ]; then
              echo "PRODUCTION_VERIFY_FAILED_ROLLBACK_START"
              vercel rollback "$ROLLBACK_URL" --cwd vercel_source/src --token "$VERCEL_TOKEN" || true
            fi
            exit "$status"
          }
          trap rollback_on_error ERR
          PROD_URL="$(vercel deploy --cwd vercel_source/src --prod --yes --token "$VERCEL_TOKEN")"
          rollback_needed=1
          echo "PRODUCTION_DEPLOYMENT_URL=$PROD_URL"
          for attempt in $(seq 1 24); do
            curl --fail --silent --show-error --location \
              --max-time 45 -H 'Cache-Control: no-cache' \
              "$PUBLIC_URL/assets/js/app.js?cb=$(date +%s%N)" -o artifacts/production_app.js || true
            curl --fail --silent --show-error --location \
              --max-time 45 -H 'Cache-Control: no-cache' \
              "$PUBLIC_URL/assets/css/app.css?cb=$(date +%s%N)" -o artifacts/production_app.css || true
            curl --fail --silent --show-error --location \
              --max-time 45 -H 'Cache-Control: no-cache' \
              "$PUBLIC_URL/assets/icons/ball-3d-v10.png?cb=$(date +%s%N)" -o artifacts/production_ball.png || true
            curl --fail --silent --show-error --location \
              --max-time 45 -H 'Cache-Control: no-cache' \
              "$PUBLIC_URL/api/health?cb=$(date +%s%N)" -o artifacts/production_health.json || true
            if grep -Fq 'Datos actualizados en línea' artifacts/production_app.js 2>/dev/null && grep -Fq 'OH_COMPACT_SECONDARY_VIEWS_V20' artifacts/production_app.js 2>/dev/null && grep -Fq 'OH_MATCH_SUMMARY_COMPACT_REFERENCE_V21' artifacts/production_app.css 2>/dev/null && grep -Fq 'OH_MATCH_THEME_AND_TITLES_V22' artifacts/production_app.css 2>/dev/null && [ -s artifacts/production_ball.png ]; then
              break
            fi
            sleep 5
          done
          grep -Fq 'Datos actualizados en línea' artifacts/production_app.js
          grep -Fq 'OH_MATCH_SUMMARY_FIXES_V11' artifacts/production_app.js
          grep -Fq 'OH_MATCH_SUMMARY_FIXES_V11' artifacts/production_app.css
          grep -Fq 'OH_LINEUP_PITCH_REFERENCE_V14' artifacts/production_app.js
          grep -Fq 'OH_LINEUP_PITCH_REFERENCE_V14' artifacts/production_app.css
          grep -Fq 'OH_EXPECTED_REAL_REFERENCE_V15' artifacts/production_app.js
          grep -Fq 'OH_EXPECTED_REAL_REFERENCE_V15' artifacts/production_app.css
          grep -Fq 'OH_EXPECTED_REAL_COMPARISON_V16' artifacts/production_app.js
          grep -Fq 'OH_EXPECTED_REAL_COMPARISON_V16' artifacts/production_app.css
          grep -Fq 'OH_COMPACT_SECONDARY_VIEWS_V20' artifacts/production_app.js
          grep -Fq 'OH_COMPACT_SECONDARY_VIEWS_V20' artifacts/production_app.css
          grep -Fq 'OH_MATCH_SUMMARY_COMPACT_REFERENCE_V21' artifacts/production_app.css
          grep -Fq 'OH_MATCH_THEME_AND_TITLES_V22' artifacts/production_app.css
          test -s artifacts/production_ball.png
          ! grep -Fq 'solo lectura' artifacts/production_app.js
          python - <<'PY'
          import json
          health=json.load(open("artifacts/production_health.json",encoding="utf-8"))
          if health.get("ok") is not True or health.get("source") != "turso":
              raise SystemExit(f"PRODUCTION_HEALTH_FAIL={health}")
          print("PRODUCTION_API_HEALTH=PASS")
          PY
          rollback_needed=0
          trap - ERR
          echo "PRODUCTION_FRONTEND_LABEL=PASS"
          echo "APK_REBUILD_REQUIRED=NO"

      - name: Subir evidencia sin secretos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oddshunter-vercel-frontend-v1-evidence
          path: |
            artifacts/vercel_inspect.json
            artifacts/preview_health.json
            artifacts/production_health.json
            artifacts/vercel_source_manifest.json
            vercel_source/src/api/**
            vercel_source/src/app.py
            vercel_source/src/backend/**
            vercel_source/src/tools/**
            vercel_source/src/requirements.txt
            vercel_source/src/package.json
            vercel_source/src/vercel.json
          if-no-files-found: ignore
