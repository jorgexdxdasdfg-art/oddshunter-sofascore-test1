name: OddsHunter RESULT SYNC HOTFIX V5

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Construir hotfix exacto
        run: |
          set -euo pipefail
          : > f24.b64
          printf '%s' '' >> f24.b64
          printf '%s' '' >> f24.b64
          printf '%s' '' >> f24.b64
          printf '%s' '' >> f24.b64
          printf '%s' '' >> f24.b64
          printf '%s' '' >> f24.b64
          printf '%s' '' >> f24.b64
          printf '%s' '' >> f24.b64
          printf '%s' '' >> f24.b64
          printf '%s' '' >> f24.b64
          base64 -d f24.b64 > futbol24_client.py
          rm -f f24.b64
          : > stage5.b64
          printf '%s' '' >> stage5.b64
          printf '%s' '' >> stage5.b64
          printf '%s' '' >> stage5.b64
          printf '%s' '' >> stage5.b64
          printf '%s' '' >> stage5.b64
          printf '%s' '' >> stage5.b64
          printf '%s' '' >> stage5.b64
          printf '%s' '' >> stage5.b64
          printf '%s' '' >> stage5.b64
          base64 -d stage5.b64 > cloud_stage5_cycle.py
          rm -f stage5.b64

          test "$(sha256sum futbol24_client.py | awk '{print $1}')" = "d8d46c0f7454fd41ea559f97189cb01f870043e9d7640f4f7dac14202e6fc286"
          test "$(sha256sum cloud_stage5_cycle.py | awk '{print $1}')" = "13ba611f000c344d7ae61fcc9e40304231168f1d9ad0f0236f9182af26ec2e37"

          python3 - <<'PY'
          from pathlib import Path
          for name in ("futbol24_client.py", "cloud_stage5_cycle.py"):
              p=Path(name)
              compile(p.read_text(encoding="utf-8"), str(p), "exec")
              print("SYNTAX_PASS", name)
          PY

          echo "F24_V5_SHA=d8d46c0f7454fd41ea559f97189cb01f870043e9d7640f4f7dac14202e6fc286"
          echo "STAGE5_V4_SHA=13ba611f000c344d7ae61fcc9e40304231168f1d9ad0f0236f9182af26ec2e37"
          echo "BUILD=PASS"

      - name: Preparar SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_PORT_SECRET: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          test -n "${VPS_HOST:-}"
          test -n "${VPS_SSH_PRIVATE_KEY:-}"

          PORT="${VPS_PORT_SECRET:-22}"
          echo "VPS_PORT=$PORT" >> "$GITHUB_ENV"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/oddshunter_v5
          chmod 600 ~/.ssh/oddshunter_v5
          ssh-keygen -y -f ~/.ssh/oddshunter_v5 >/dev/null
          ssh-keyscan -p "$PORT" -H "$VPS_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          echo "SSH=PASS"

      - name: Copiar hotfix al VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/oddshunter_v5 -P "$VPS_PORT"             -o BatchMode=yes -o StrictHostKeyChecking=yes             futbol24_client.py             "$VPS_USER@$VPS_HOST:/tmp/futbol24_client_DATE_IDENTITY_V5.py"

          scp -i ~/.ssh/oddshunter_v5 -P "$VPS_PORT"             -o BatchMode=yes -o StrictHostKeyChecking=yes             cloud_stage5_cycle.py             "$VPS_USER@$VPS_HOST:/tmp/cloud_stage5_cycle_SCOPE_FAIR_V4.py"

          echo "SCP=PASS"

      - name: Reparar exactos + Turso + fix permanente
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          set -euo pipefail

          URL64="$(printf '%s' "$TURSO_DATABASE_URL" | base64 -w0)"
          TOK64="$(printf '%s' "$TURSO_AUTH_TOKEN" | base64 -w0)"

          ssh -i ~/.ssh/oddshunter_v5 -p "$VPS_PORT"             -o BatchMode=yes -o StrictHostKeyChecking=yes             "$VPS_USER@$VPS_HOST"             "F24_CURRENT='fece33b2d3bee6a1ddd00121e6ae6310724c0095b85493452edb7c9681e38fd0' F24_V5='d8d46c0f7454fd41ea559f97189cb01f870043e9d7640f4f7dac14202e6fc286' STAGE5_CURRENT='b4b93b0edc6e864bafeed77a1b019426c09ce88834d84edf000568bf0abb2cb0' STAGE5_V4='13ba611f000c344d7ae61fcc9e40304231168f1d9ad0f0236f9182af26ec2e37' URL64='$URL64' TOK64='$TOK64' bash -s"             <<'REMOTE' | tee RESULT_SYNC_HOTFIX_V5.txt
          set -euo pipefail

          if [ "$(id -u)" -eq 0 ]; then
            SUDO=""
          else
            SUDO="sudo -n"
          fi

          CUR="$(readlink -f /opt/oddshunter/current)"
          DB="$CUR/data/oddshunter.db"
          PY="$CUR/.venv-cloud/bin/python"
          F24="$CUR/futbol24_client.py"
          STAGE5="$CUR/cloud_stage5_cycle.py"
          F24_PATCH="/tmp/futbol24_client_DATE_IDENTITY_V5.py"
          STAGE5_PATCH="/tmp/cloud_stage5_cycle_SCOPE_FAIR_V4.py"
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          F24_BAK="$CUR/futbol24_client.py.PRE_RESULT_SYNC_V5_$STAMP"
          STAGE5_BAK="$CUR/cloud_stage5_cycle.py.PRE_RESULT_SYNC_V5_$STAMP"
          DB_BAK="/var/lib/oddshunter/data/oddshunter.db.PRE_RESULT_SYNC_V5_$STAMP"

          URL="$(printf '%s' "$URL64" | base64 -d)"
          TOK="$(printf '%s' "$TOK64" | base64 -d)"

          echo "CURRENT=$CUR"
          echo "DB=$DB"
          echo "F24_BEFORE_SHA=$(sha256sum "$F24" | awk '{print $1}')"
          echo "STAGE5_BEFORE_SHA=$(sha256sum "$STAGE5" | awk '{print $1}')"

          GOT_F24="$(sha256sum "$F24" | awk '{print $1}')"
          GOT_STAGE5="$(sha256sum "$STAGE5" | awk '{print $1}')"

          if [ "$GOT_F24" != "$F24_CURRENT" ] && [ "$GOT_F24" != "$F24_V5" ]; then
            echo "F24_SOURCE_DRIFT=YES"
            exit 21
          fi
          if [ "$GOT_STAGE5" != "$STAGE5_CURRENT" ] && [ "$GOT_STAGE5" != "$STAGE5_V4" ]; then
            echo "STAGE5_SOURCE_DRIFT=YES"
            exit 22
          fi

          echo
          echo "========== TURSO PREFLIGHT READ ONLY =========="
          $SUDO -u oddshunter env             TURSO_DATABASE_URL="$URL"             TURSO_AUTH_TOKEN="$TOK"             "$PY" -u "$CUR/cloud_stage6_publish.py" --preflight-only
          echo "TURSO_PREFLIGHT=PASS"

          $SUDO systemctl stop oddshunter.service
          echo "SERVICE_STOP=PASS"

          $SUDO cp -a "$F24" "$F24_BAK"
          $SUDO cp -a "$STAGE5" "$STAGE5_BAK"
          $SUDO cp -a "$DB" "$DB_BAK"
          echo "F24_BACKUP=$F24_BAK"
          echo "STAGE5_BACKUP=$STAGE5_BAK"
          echo "DB_BACKUP=$DB_BAK"

          rollback() {
            rc=$?
            echo "ROLLBACK=START rc=$rc"
            $SUDO cp -a "$F24_BAK" "$F24" || true
            $SUDO cp -a "$STAGE5_BAK" "$STAGE5" || true
            $SUDO cp -a "$DB_BAK" "$DB" || true
            $SUDO chown oddshunter:oddshunter "$DB" || true
            $SUDO systemctl restart oddshunter.service || true
            echo "ROLLBACK=DONE"
            exit "$rc"
          }
          trap rollback ERR

          echo
          echo "========== INSTALL FUTBOL24 V5 =========="
          $SUDO install -o root -g root -m 0644 "$F24_PATCH" "$F24"
          test "$(sha256sum "$F24" | awk '{print $1}')" = "$F24_V5"

          $SUDO -u oddshunter "$PY" - "$F24" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          source=p.read_text(encoding="utf-8")
          compile(source, str(p), "exec")
          required=(
              "hours <= 30.0",
              "identity_registry.get(value)",
              "Futbol24 rechazo mejor candidato:",
          )
          for marker in required:
              if marker not in source:
                  raise SystemExit(f"F24_PATCH_MARKER_MISSING={marker}")
          print("F24_V5_SYNTAX_AND_MARKERS=PASS")
          PY

          echo
          echo "========== BEFORE TARGETS =========="
          $SUDO -u oddshunter "$PY" - "$DB" <<'PY'
          import sqlite3,sys
          ids=(16835069,15285812,16390710)
          con=sqlite3.connect(f"file:{sys.argv[1]}?mode=ro",uri=True)
          con.row_factory=sqlite3.Row
          for r in con.execute(
              "SELECT match_id,sofascore_id,kickoff,status,home_goals,away_goals "
              "FROM matches WHERE sofascore_id IN (?,?,?) ORDER BY sofascore_id",
              ids
          ):
              print(dict(r))
          con.close()
          PY

          cd "$CUR"

          export ODDSHUNTER_RUNTIME_MODE=cloud
          export ODDSHUNTER_ALLOW_WORK_DB_WRITE=1
          export ODDSHUNTER_DISABLE_TRAINING=1
          export ODDSHUNTER_BROWSER_HEADLESS=1
          export ODDSHUNTER_CHROMIUM_SANDBOX=0
          export ODDSHUNTER_FLASHSCORE_MAX_MATCHES_PER_CYCLE=4

          sync_one() {
            KEY="$1"
            EID="$2"

            echo
            echo "================================================================"
            echo "DIRECT_SYNC_V5 key=$KEY event_id=$EID"
            echo "================================================================"

            set +e
            $SUDO -u oddshunter env               ODDSHUNTER_RUNTIME_MODE="$ODDSHUNTER_RUNTIME_MODE"               ODDSHUNTER_ALLOW_WORK_DB_WRITE="$ODDSHUNTER_ALLOW_WORK_DB_WRITE"               ODDSHUNTER_DISABLE_TRAINING="$ODDSHUNTER_DISABLE_TRAINING"               ODDSHUNTER_BROWSER_HEADLESS="$ODDSHUNTER_BROWSER_HEADLESS"               ODDSHUNTER_CHROMIUM_SANDBOX="$ODDSHUNTER_CHROMIUM_SANDBOX"               ODDSHUNTER_FLASHSCORE_MAX_MATCHES_PER_CYCLE="$ODDSHUNTER_FLASHSCORE_MAX_MATCHES_PER_CYCLE"               "$PY" -u cloud_incremental_result_sync.py               --key "$KEY"               --event-id "$EID"               > "/tmp/direct_v5_$EID.log" 2>&1
            RC=$?
            set -e

            cat "/tmp/direct_v5_$EID.log"
            echo "DIRECT_SYNC_PROCESS_RC event_id=$EID rc=$RC"

            REPORT="$CUR/data/automation/cloud_incremental_results/last.json"
            test -f "$REPORT"

            $SUDO -u oddshunter "$PY" - "$REPORT" "$EID" <<'PY'
          import json,sys
          report=json.load(open(sys.argv[1],encoding="utf-8"))
          eid=int(sys.argv[2])
          rows=[
              x for x in (report.get("events") or [])
              if isinstance(x,dict) and int(x.get("event_id") or -1)==eid
          ]
          if len(rows)!=1:
              raise SystemExit(f"DIRECT_REPORT_EVENT_COUNT=FAIL eid={eid} rows={len(rows)}")
          row=rows[0]
          print("DIRECT_REPORT =",json.dumps(row,ensure_ascii=False))
          if row.get("result")!="COMMITTED":
              raise SystemExit(
                  f"DIRECT_SYNC_NOT_COMMITTED eid={eid} result={row.get('result')}"
              )
          snap=row.get("snapshot") or {}
          if snap.get("source")!="futbol24" or snap.get("state")!="finished":
              raise SystemExit(
                  f"F24_SNAPSHOT_NOT_FINISHED eid={eid} snapshot={snap}"
              )
          print(f"DIRECT_SYNC_COMMITTED_GATE=PASS event_id={eid}")
          PY
          }

          sync_one "leagues-cup" 16835069
          sync_one "usa-usl-championship" 15285812
          sync_one "liga-betplay-colombia" 16390710

          echo
          echo "========== VERIFY SQLITE =========="
          $SUDO -u oddshunter "$PY" - "$DB" <<'PY'
          import sqlite3,sys
          expected={
              16835069:(16596,2,0),
              15285812:(29312,2,1),
              16390710:(29332,2,1),
          }
          con=sqlite3.connect(f"file:{sys.argv[1]}?mode=ro",uri=True)
          con.row_factory=sqlite3.Row

          qc=con.execute("PRAGMA quick_check").fetchone()[0]
          fk=len(con.execute("PRAGMA foreign_key_check").fetchall())
          print("quick_check =",qc)
          print("foreign_key_errors =",fk)
          if qc!="ok" or fk!=0:
              raise SystemExit("SQLITE_INTEGRITY=FAIL")

          rows={int(r["sofascore_id"]):dict(r) for r in con.execute(
              "SELECT match_id,sofascore_id,status,home_goals,away_goals "
              "FROM matches WHERE sofascore_id IN (16835069,15285812,16390710)"
          )}

          for eid,(mid,hg,ag) in expected.items():
              r=rows.get(eid)
              print("TARGET_AFTER =",r)
              if r is None:
                  raise SystemExit(f"MISSING_TARGET={eid}")
              if int(r["match_id"])!=mid:
                  raise SystemExit(f"MATCH_ID_DRIFT eid={eid} got={r['match_id']} expected={mid}")
              if (r["home_goals"],r["away_goals"])!=(hg,ag):
                  raise SystemExit(
                      f"SCORE_NOT_UPDATED eid={eid} got={(r['home_goals'],r['away_goals'])} expected={(hg,ag)}"
                  )
              if str(r["status"] or "").upper() not in {
                  "FT","AET","PEN","FINISHED","FINAL"
              }:
                  raise SystemExit(f"STATUS_NOT_FINAL eid={eid} status={r['status']}")

          print("THREE_RESULTS_SQLITE=PASS")
          con.close()
          PY

          echo
          echo "========== INSTALL STAGE5 PERMANENT QUEUE FIX =========="
          $SUDO install -o root -g root -m 0644 "$STAGE5_PATCH" "$STAGE5"
          test "$(sha256sum "$STAGE5" | awk '{print $1}')" = "$STAGE5_V4"

          $SUDO -u oddshunter "$PY" - "$STAGE5" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          source=p.read_text(encoding="utf-8")
          compile(source, str(p), "exec")
          required=(
              "all_registry_by_league",
              "fair_score",
              '"8"',
          )
          for marker in required:
              if marker not in source:
                  raise SystemExit(f"STAGE5_PATCH_MARKER_MISSING={marker}")
          print("STAGE5_PERMANENT_FIX=PASS")
          PY

          echo
          echo "========== STAGE6 -> TURSO =========="
          $SUDO -u oddshunter env             TURSO_DATABASE_URL="$URL"             TURSO_AUTH_TOKEN="$TOK"             ODDSHUNTER_STAGE6_ALLOW_TURSO_WRITE=1             ODDSHUNTER_DISABLE_TRAINING=1             "$PY" -u cloud_stage6_publish.py             > /tmp/stage6_result_sync_v5.log 2>&1

          cat /tmp/stage6_result_sync_v5.log

          REPORT="$CUR/artifacts/cloud_stage6_publisher.json"
          test -f "$REPORT"

          $SUDO -u oddshunter "$PY" - "$REPORT" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          print("STAGE6_PASS =",d.get("stage6_pass"))
          if d.get("stage6_pass") is not True:
              raise SystemExit("STAGE6_PASS=FALSE")

          wanted={16596,29312,29332}
          core=d.get("core_meta") or {}
          published={int(x) for x in (core.get("published_match_ids") or [])}
          print("PUBLISHED_MATCH_IDS =",sorted(published))
          print("WANTED_MATCH_IDS =",sorted(wanted))
          if not wanted.issubset(published):
              raise SystemExit(
                  f"TURSO_TARGETS_NOT_PUBLISHED missing={sorted(wanted-published)}"
              )
          print("TURSO_THREE_RESULTS_GATE=PASS")
          PY

          $SUDO systemctl restart oddshunter.service
          sleep 5
          test "$($SUDO systemctl is-active oddshunter.service)" = "active"
          echo "SERVICE_RESTART=PASS"

          echo "F24_AFTER_SHA=$(sha256sum "$F24" | awk '{print $1}')"
          echo "STAGE5_AFTER_SHA=$(sha256sum "$STAGE5" | awk '{print $1}')"
          echo "RESULT_SYNC_SCOPE=ALL_KNOWN_REGISTRY_COMPETITIONS"
          echo "RESULT_SYNC_QUEUE=NEWEST_OLDEST_FAIR"
          echo "RESULT_SYNC_DEFAULT_TARGETS_PER_CYCLE=8"
          echo "FUTBOL24_DATE_IDENTITY=UTC_LOCAL_DATE_TOLERANCE"
          echo "FUTBOL24_ALIAS_BRIDGE=READ_ONLY_REGISTRY_ALIASES"

          trap - ERR
          echo "V5_SERVER_SIDE=PASS"
          REMOTE

      - name: Verificar API Mobile
        run: |
          set -euo pipefail
          mkdir -p api_probe_v5

          for TARGET in             "leagues-cup/16835069"             "usa-usl-championship/15285812"             "liga-betplay-colombia/16390710"
          do
            SAFE="${TARGET//\//_}"
            echo "===== $TARGET ====="

            curl               --fail               --silent               --show-error               --location               --connect-timeout 15               --max-time 45               -H 'Cache-Control: no-cache'               "https://oddshunter-mobile.vercel.app/api/match/$TARGET?cb=$(date +%s%N)"               -o "api_probe_v5/$SAFE.json"

            python3 -m json.tool "api_probe_v5/$SAFE.json" | head -n 160
          done

          echo "API_THREE_ENDPOINTS_HTTP_200=PASS"

      - name: Subir evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oddshunter-result-sync-hotfix-v5-evidence
          path: |
            RESULT_SYNC_HOTFIX_V5.txt
            api_probe_v5/
          if-no-files-found: warn
          retention-days: 7

      - name: Gate final
        run: |
          set -euo pipefail
          grep -q "DIRECT_SYNC_COMMITTED_GATE=PASS event_id=16835069" RESULT_SYNC_HOTFIX_V5.txt
          grep -q "DIRECT_SYNC_COMMITTED_GATE=PASS event_id=15285812" RESULT_SYNC_HOTFIX_V5.txt
          grep -q "DIRECT_SYNC_COMMITTED_GATE=PASS event_id=16390710" RESULT_SYNC_HOTFIX_V5.txt
          grep -q "THREE_RESULTS_SQLITE=PASS" RESULT_SYNC_HOTFIX_V5.txt
          grep -q "TURSO_THREE_RESULTS_GATE=PASS" RESULT_SYNC_HOTFIX_V5.txt
          grep -q "SERVICE_RESTART=PASS" RESULT_SYNC_HOTFIX_V5.txt
          grep -q "V5_SERVER_SIDE=PASS" RESULT_SYNC_HOTFIX_V5.txt
          echo "FINAL=PASS_ODDSHUNTER_RESULT_SYNC_HOTFIX_V5"
