name: OddsHunter VPS Runtime Status

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_PORT_SECRET: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          PORT="${VPS_PORT_SECRET:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/oddshunter_status
          chmod 600 ~/.ssh/oddshunter_status
          ssh-keyscan -p "$PORT" -H "$VPS_HOST" > ~/.ssh/known_hosts
          echo "VPS_PORT=$PORT" >> "$GITHUB_ENV"

      - name: Read runtime status
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/oddshunter_status -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'set -euo pipefail
            if [ "$(id -u)" -eq 0 ]; then SUDO=""; else SUDO="sudo -n"; fi
            for unit in \
              oddshunter.service \
              oddshunter-live-sync.timer \
              oddshunter-schedule-refresh.timer; do
              echo "UNIT=$unit ENABLED=$($SUDO systemctl is-enabled "$unit" 2>/dev/null || true) ACTIVE=$($SUDO systemctl is-active "$unit" 2>/dev/null || true)"
            done
            $SUDO systemctl --no-pager --full status oddshunter.service | sed -n "1,16p"
            for unit in oddshunter.service oddshunter-live-sync.service oddshunter-schedule-refresh.service; do
              echo "========== JOURNAL $unit =========="
              $SUDO journalctl -u "$unit" --since "90 minutes ago" --no-pager -n 220 || true
            done
            if [ -f /var/lib/oddshunter/data/automation/last_run_selective.json ]; then
              tail -n 80 /var/lib/oddshunter/data/automation/last_run_selective.json
            fi
            for report in \
              /var/lib/oddshunter/data/automation/cloud_live_status/last.json \
              /opt/oddshunter/current/data/automation/cloud_live_status/last.json \
              /var/lib/oddshunter/data/automation/cloud_schedule_refresh/last.json \
              /opt/oddshunter/current/data/automation/cloud_schedule_refresh/last.json \
              /opt/oddshunter/current/artifacts/cloud_stage5_cycle.json; do
              if [ -f "$report" ]; then
                echo "========== REPORT $report =========="
                tail -n 180 "$report"
              fi
            done'
