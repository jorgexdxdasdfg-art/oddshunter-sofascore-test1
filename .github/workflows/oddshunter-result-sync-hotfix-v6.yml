name: OddsHunter RESULT SYNC HOTFIX V6

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Construir hotfix exacto
        run: |
          set -eEuo pipefail
          test -f futbol24_client.py
          test -f cloud_incremental_result_sync.py
          test -f cloud_stage6_publish_reconciled.py
          : > stage5.b64
          printf '%s' '' >> stage5.b64
          printf '%s' '' >> stage5.b64
          printf '%s' '' >> stage5.b64
          printf '%s' '' >> stage5.b64
          printf '%s' '' >> stage5.b64
          printf '%s' '' >> stage5.b64
          printf '%s' '' >> stage5.b64
          printf '%s' '' >> stage5.b64
          printf '%s' '' >> stage5.b64
          base64 -d stage5.b64 > cloud_stage5_cycle.py
          rm -f stage5.b64

          test "$(sha256sum futbol24_client.py | awk '{print $1}')" = "0e7d6829c829ecd5278af10c3388a36319b7be9f7beab0ac0f759c1b6e359995"
          test "$(sha256sum cloud_incremental_result_sync.py | awk '{print $1}')" = "88007cc079c429d60b14183f98de1adc88812b7e93d57c9c06dc5624d96ec766"
          test "$(sha256sum cloud_stage5_cycle.py | awk '{print $1}')" = "13ba611f000c344d7ae61fcc9e40304231168f1d9ad0f0236f9182af26ec2e37"
          test "$(sha256sum cloud_stage6_publish_reconciled.py | awk '{print $1}')" = "5437acb3dbf169e058abda4f629dc09813b4e1feb74e3026352ca6aef89c3cd9"

          python3 - <<'PY'
          from pathlib import Path
          for name in ("futbol24_client.py", "cloud_incremental_result_sync.py", "cloud_stage5_cycle.py", "cloud_stage6_publish_reconciled.py"):
              p=Path(name)
              compile(p.read_text(encoding="utf-8"), str(p), "exec")
              print("SYNTAX_PASS", name)
          PY

          echo "F24_V6_SHA=0e7d6829c829ecd5278af10c3388a36319b7be9f7beab0ac0f759c1b6e359995"
          echo "RESULT_SYNC_V6_SHA=88007cc079c429d60b14183f98de1adc88812b7e93d57c9c06dc5624d96ec766"
          echo "STAGE5_V4_SHA=13ba611f000c344d7ae61fcc9e40304231168f1d9ad0f0236f9182af26ec2e37"
          echo "STAGE6_RECON_SHA=5437acb3dbf169e058abda4f629dc09813b4e1feb74e3026352ca6aef89c3cd9"
          echo "BUILD=PASS"

      - name: Preparar SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_PORT_SECRET: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          test -n "${VPS_HOST:-}"
          test -n "${VPS_SSH_PRIVATE_KEY:-}"

          PORT="${VPS_PORT_SECRET:-22}"
          echo "VPS_PORT=$PORT" >> "$GITHUB_ENV"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/oddshunter_v6
          chmod 600 ~/.ssh/oddshunter_v6
          ssh-keygen -y -f ~/.ssh/oddshunter_v6 >/dev/null
          ssh-keyscan -p "$PORT" -H "$VPS_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          echo "SSH=PASS"

      - name: Copiar hotfix al VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/oddshunter_v6 -P "$VPS_PORT"             -o BatchMode=yes -o StrictHostKeyChecking=yes             futbol24_client.py             "$VPS_USER@$VPS_HOST:/tmp/futbol24_client_DATE_IDENTITY_V6.py"

          scp -i ~/.ssh/oddshunter_v6 -P "$VPS_PORT"             -o BatchMode=yes -o StrictHostKeyChecking=yes             cloud_incremental_result_sync.py             "$VPS_USER@$VPS_HOST:/tmp/cloud_incremental_result_sync_IDENTITY_V6.py"

          scp -i ~/.ssh/oddshunter_v6 -P "$VPS_PORT"             -o BatchMode=yes -o StrictHostKeyChecking=yes             cloud_stage5_cycle.py             "$VPS_USER@$VPS_HOST:/tmp/cloud_stage5_cycle_SCOPE_FAIR_V4.py"

          scp -i ~/.ssh/oddshunter_v6 -P "$VPS_PORT"             -o BatchMode=yes -o StrictHostKeyChecking=yes             cloud_stage6_publish_reconciled.py             "$VPS_USER@$VPS_HOST:/tmp/cloud_stage6_publish_RECON_V13.py"

          echo "SCP=PASS"

      - name: Reparar exactos + Turso + fix permanente
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          set -euo pipefail

          URL64="$(printf '%s' "$TURSO_DATABASE_URL" | base64 -w0)"
          TOK64="$(printf '%s' "$TURSO_AUTH_TOKEN" | base64 -w0)"

          ssh -i ~/.ssh/oddshunter_v6 -p "$VPS_PORT"             -o BatchMode=yes -o StrictHostKeyChecking=yes             "$VPS_USER@$VPS_HOST"             "F24_CURRENT='d8d46c0f7454fd41ea559f97189cb01f870043e9d7640f4f7dac14202e6fc286' F24_V6='0e7d6829c829ecd5278af10c3388a36319b7be9f7beab0ac0f759c1b6e359995' SYNC_CURRENT='1294c8fb8e2e8454a8249c7feea048ae293850286a165b05be91ef6a53b8b04a' SYNC_V6='88007cc079c429d60b14183f98de1adc88812b7e93d57c9c06dc5624d96ec766' STAGE5_CURRENT='b4b93b0edc6e864bafeed77a1b019426c09ce88834d84edf000568bf0abb2cb0' STAGE5_V4='13ba611f000c344d7ae61fcc9e40304231168f1d9ad0f0236f9182af26ec2e37' STAGE6_RECON='5437acb3dbf169e058abda4f629dc09813b4e1feb74e3026352ca6aef89c3cd9' URL64='$URL64' TOK64='$TOK64' bash -s"             <<'REMOTE' | tee RESULT_SYNC_HOTFIX_V6.txt
          set -eEuo pipefail

          if [ "$(id -u)" -eq 0 ]; then
            SUDO=""
          else
            SUDO="sudo -n"
          fi

          CUR="$(readlink -f /opt/oddshunter/current)"
          DB="$CUR/data/oddshunter.db"
          PY="$CUR/.venv-cloud/bin/python"
          F24="$CUR/futbol24_client.py"
          SYNC="$CUR/cloud_incremental_result_sync.py"
          STAGE5="$CUR/cloud_stage5_cycle.py"
          STAGE6_WRAPPER="$CUR/cloud_stage6_publish_reconciled.py"
          F24_PATCH="/tmp/futbol24_client_DATE_IDENTITY_V6.py"
          SYNC_PATCH="/tmp/cloud_incremental_result_sync_IDENTITY_V6.py"
          STAGE5_PATCH="/tmp/cloud_stage5_cycle_SCOPE_FAIR_V4.py"
          STAGE6_PATCH="/tmp/cloud_stage6_publish_RECON_V13.py"
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          F24_BAK="$CUR/futbol24_client.py.PRE_RESULT_SYNC_V6_$STAMP"
          SYNC_BAK="$CUR/cloud_incremental_result_sync.py.PRE_IDENTITY_V6_$STAMP"
          STAGE5_BAK="$CUR/cloud_stage5_cycle.py.PRE_RESULT_SYNC_V6_$STAMP"
          STAGE6_BAK="$CUR/cloud_stage6_publish_reconciled.py.PRE_RESULT_SYNC_V6_$STAMP"
          DB_BAK="/var/lib/oddshunter/data/oddshunter.db.PRE_RESULT_SYNC_V6_$STAMP"

          URL="$(printf '%s' "$URL64" | base64 -d)"
          TOK="$(printf '%s' "$TOK64" | base64 -d)"

          echo "CURRENT=$CUR"
          echo "DB=$DB"
          echo "F24_BEFORE_SHA=$(sha256sum "$F24" | awk '{print $1}')"
          echo "SYNC_BEFORE_SHA=$(sha256sum "$SYNC" | awk '{print $1}')"
          echo "STAGE5_BEFORE_SHA=$(sha256sum "$STAGE5" | awk '{print $1}')"

          GOT_F24="$(sha256sum "$F24" | awk '{print $1}')"
          GOT_SYNC="$(sha256sum "$SYNC" | awk '{print $1}')"
          GOT_STAGE5="$(sha256sum "$STAGE5" | awk '{print $1}')"
          if [ -f "$STAGE6_WRAPPER" ]; then
            GOT_STAGE6="$(sha256sum "$STAGE6_WRAPPER" | awk '{print $1}')"
            if [ "$GOT_STAGE6" != "$STAGE6_RECON" ]; then
              echo "STAGE6_WRAPPER_SOURCE_DRIFT=YES"
              exit 24
            fi
          fi

          if [ "$GOT_F24" != "$F24_CURRENT" ] && [ "$GOT_F24" != "$F24_V6" ]; then
            echo "F24_SOURCE_DRIFT=YES"
            exit 21
          fi
          if [ "$GOT_SYNC" != "$SYNC_CURRENT" ] && [ "$GOT_SYNC" != "$SYNC_V6" ]; then
            echo "SYNC_SOURCE_DRIFT=YES"
            exit 23
          fi
          if [ "$GOT_STAGE5" != "$STAGE5_CURRENT" ] && [ "$GOT_STAGE5" != "$STAGE5_V4" ]; then
            echo "STAGE5_SOURCE_DRIFT=YES"
            exit 22
          fi

          echo
          echo "========== TURSO PREFLIGHT READ ONLY =========="
          $SUDO -u oddshunter env             TURSO_DATABASE_URL="$URL"             TURSO_AUTH_TOKEN="$TOK"             "$PY" -u "$CUR/cloud_stage6_publish.py" --preflight-only
          echo "TURSO_PREFLIGHT=PASS"

          $SUDO systemctl stop oddshunter.service
          echo "SERVICE_STOP=PASS"

          $SUDO cp -a "$F24" "$F24_BAK"
          $SUDO cp -a "$SYNC" "$SYNC_BAK"
          $SUDO cp -a "$STAGE5" "$STAGE5_BAK"
          STAGE6_WRAPPER_HAD=0
          if [ -f "$STAGE6_WRAPPER" ]; then
            $SUDO cp -a "$STAGE6_WRAPPER" "$STAGE6_BAK"
            STAGE6_WRAPPER_HAD=1
          fi
          $SUDO cp -a "$DB" "$DB_BAK"
          echo "F24_BACKUP=$F24_BAK"
          echo "SYNC_BACKUP=$SYNC_BAK"
          echo "STAGE5_BACKUP=$STAGE5_BAK"
          echo "DB_BACKUP=$DB_BAK"

          rollback() {
            rc=$?
            echo "ROLLBACK=START rc=$rc"
            $SUDO cp -a "$F24_BAK" "$F24" || true
            $SUDO cp -a "$SYNC_BAK" "$SYNC" || true
            $SUDO cp -a "$STAGE5_BAK" "$STAGE5" || true
            if [ "$STAGE6_WRAPPER_HAD" -eq 1 ]; then
              $SUDO cp -a "$STAGE6_BAK" "$STAGE6_WRAPPER" || true
            else
              $SUDO rm -f "$STAGE6_WRAPPER" || true
            fi
            $SUDO cp -a "$DB_BAK" "$DB" || true
            $SUDO chown oddshunter:oddshunter "$DB" || true
            $SUDO systemctl restart oddshunter.service || true
            echo "ROLLBACK=DONE"
            exit "$rc"
          }
          trap rollback ERR

          echo
          echo "========== INSTALL RESULT SYNC IDENTITY V6 =========="
          $SUDO install -o root -g root -m 0644 "$SYNC_PATCH" "$SYNC"
          test "$(sha256sum "$SYNC" | awk '{print $1}')" = "$SYNC_V6"
          $SUDO -u oddshunter "$PY" - "$SYNC" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          source=p.read_text(encoding="utf-8")
          compile(source, str(p), "exec")
          marker="row = _db_row(event_id) or _schedule_row(key, event_id)"
          if marker not in source:
              raise SystemExit(f"RESULT_SYNC_MARKER_MISSING={marker}")
          print("RESULT_SYNC_IDENTITY_V6=PASS")
          PY

          echo
          echo "========== INSTALL FUTBOL24 V6 =========="
          $SUDO install -o root -g root -m 0644 "$F24_PATCH" "$F24"
          test "$(sha256sum "$F24" | awk '{print $1}')" = "$F24_V6"

          $SUDO -u oddshunter "$PY" - "$F24" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          source=p.read_text(encoding="utf-8")
          compile(source, str(p), "exec")
          required=(
              "MAX_DATE_DELTA_HOURS = 36.0",
              "\"/stats/team/results/latest\"",
              "\"orientation\": \"reversed\"",
          )
          for marker in required:
              if marker not in source:
                  raise SystemExit(f"F24_PATCH_MARKER_MISSING={marker}")
          print("F24_V6_SYNTAX_AND_MARKERS=PASS")
          PY

          echo
          echo "========== BEFORE TARGETS =========="
          $SUDO -u oddshunter "$PY" - "$DB" <<'PY'
          import sqlite3,sys
          ids=(16835069,15285812,16390710)
          con=sqlite3.connect(f"file:{sys.argv[1]}?mode=ro",uri=True)
          con.row_factory=sqlite3.Row
          for r in con.execute(
              "SELECT match_id,sofascore_id,kickoff,status,home_goals,away_goals "
              "FROM matches WHERE sofascore_id IN (?,?,?) ORDER BY sofascore_id",
              ids
          ):
              print(dict(r))
          con.close()
          PY

          cd "$CUR"

          export ODDSHUNTER_RUNTIME_MODE=cloud
          export ODDSHUNTER_ALLOW_WORK_DB_WRITE=1
          export ODDSHUNTER_DISABLE_TRAINING=1
          export ODDSHUNTER_BROWSER_HEADLESS=1
          export ODDSHUNTER_CHROMIUM_SANDBOX=0
          export ODDSHUNTER_FLASHSCORE_MAX_MATCHES_PER_CYCLE=4

          sync_one() {
            KEY="$1"
            EID="$2"

            echo
            echo "================================================================"
            echo "DIRECT_SYNC_V6 key=$KEY event_id=$EID"
            echo "================================================================"

            if $SUDO -u oddshunter env               ODDSHUNTER_RUNTIME_MODE="$ODDSHUNTER_RUNTIME_MODE"               ODDSHUNTER_ALLOW_WORK_DB_WRITE="$ODDSHUNTER_ALLOW_WORK_DB_WRITE"               ODDSHUNTER_DISABLE_TRAINING="$ODDSHUNTER_DISABLE_TRAINING"               ODDSHUNTER_BROWSER_HEADLESS="$ODDSHUNTER_BROWSER_HEADLESS"               ODDSHUNTER_CHROMIUM_SANDBOX="$ODDSHUNTER_CHROMIUM_SANDBOX"               ODDSHUNTER_FLASHSCORE_MAX_MATCHES_PER_CYCLE="$ODDSHUNTER_FLASHSCORE_MAX_MATCHES_PER_CYCLE"               "$PY" -u cloud_incremental_result_sync.py               --key "$KEY"               --event-id "$EID"               > "/tmp/direct_v6_$EID.log" 2>&1; then
              RC=0
            else
              RC=$?
            fi

            cat "/tmp/direct_v6_$EID.log"
            echo "DIRECT_SYNC_PROCESS_RC event_id=$EID rc=$RC"
            test "$RC" -eq 0
            grep -q '"result": "COMMITTED"' "/tmp/direct_v6_$EID.log"
            grep -q '"source": "futbol24"' "/tmp/direct_v6_$EID.log"
            grep -q '"state": "finished"' "/tmp/direct_v6_$EID.log"
            echo "DIRECT_SYNC_COMMITTED_GATE=PASS event_id=$EID"
          }

          sync_one "leagues-cup" 16835069
          sync_one "usa-usl-championship" 15285812
          sync_one "liga-betplay-colombia" 16390710

          echo
          echo "========== VERIFY SQLITE =========="
          $SUDO -u oddshunter "$PY" - "$DB" <<'PY'
          import sqlite3,sys
          expected={
              16835069:(16596,2,0),
              15285812:(29312,2,1),
              16390710:(29332,2,1),
          }
          con=sqlite3.connect(f"file:{sys.argv[1]}?mode=ro",uri=True)
          con.row_factory=sqlite3.Row

          qc=con.execute("PRAGMA quick_check").fetchone()[0]
          fk=len(con.execute("PRAGMA foreign_key_check").fetchall())
          print("quick_check =",qc)
          print("foreign_key_errors =",fk)
          if qc!="ok" or fk!=0:
              raise SystemExit("SQLITE_INTEGRITY=FAIL")

          rows={int(r["sofascore_id"]):dict(r) for r in con.execute(
              "SELECT match_id,sofascore_id,status,home_goals,away_goals "
              "FROM matches WHERE sofascore_id IN (16835069,15285812,16390710)"
          )}

          for eid,(mid,hg,ag) in expected.items():
              r=rows.get(eid)
              print("TARGET_AFTER =",r)
              if r is None:
                  raise SystemExit(f"MISSING_TARGET={eid}")
              if int(r["match_id"])!=mid:
                  raise SystemExit(f"MATCH_ID_DRIFT eid={eid} got={r['match_id']} expected={mid}")
              if (r["home_goals"],r["away_goals"])!=(hg,ag):
                  raise SystemExit(
                      f"SCORE_NOT_UPDATED eid={eid} got={(r['home_goals'],r['away_goals'])} expected={(hg,ag)}"
                  )
              if str(r["status"] or "").upper() not in {
                  "FT","AET","PEN","FINISHED","FINAL"
              }:
                  raise SystemExit(f"STATUS_NOT_FINAL eid={eid} status={r['status']}")

          print("THREE_RESULTS_SQLITE=PASS")
          con.close()
          PY

          echo
          echo "========== INSTALL STAGE5 PERMANENT QUEUE FIX =========="
          $SUDO install -o root -g root -m 0644 "$STAGE5_PATCH" "$STAGE5"
          test "$(sha256sum "$STAGE5" | awk '{print $1}')" = "$STAGE5_V4"

          $SUDO -u oddshunter "$PY" - "$STAGE5" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          source=p.read_text(encoding="utf-8")
          compile(source, str(p), "exec")
          required=(
              "all_registry_by_league",
              "fair_score",
              '"8"',
          )
          for marker in required:
              if marker not in source:
                  raise SystemExit(f"STAGE5_PATCH_MARKER_MISSING={marker}")
          print("STAGE5_PERMANENT_FIX=PASS")
          PY

          echo
          echo "========== STAGE5 SAME-RUN CERTIFICATION =========="
          if $SUDO -u oddshunter env             ODDSHUNTER_RUNTIME_MODE="$ODDSHUNTER_RUNTIME_MODE"             ODDSHUNTER_ALLOW_WORK_DB_WRITE="$ODDSHUNTER_ALLOW_WORK_DB_WRITE"             ODDSHUNTER_DISABLE_TRAINING="$ODDSHUNTER_DISABLE_TRAINING"             ODDSHUNTER_BROWSER_HEADLESS="$ODDSHUNTER_BROWSER_HEADLESS"             ODDSHUNTER_CHROMIUM_SANDBOX="$ODDSHUNTER_CHROMIUM_SANDBOX"             ODDSHUNTER_FLASHSCORE_MAX_MATCHES_PER_CYCLE="$ODDSHUNTER_FLASHSCORE_MAX_MATCHES_PER_CYCLE"             "$PY" -u "$STAGE5"             > /tmp/stage5_result_sync_v6.log 2>&1; then
            STAGE5_RC=0
          else
            STAGE5_RC=$?
          fi
          cat /tmp/stage5_result_sync_v6.log
          echo "STAGE5_PROCESS_RC=$STAGE5_RC"
          test "$STAGE5_RC" -eq 0

          $SUDO -u oddshunter "$PY" - "$CUR/artifacts/cloud_stage5_cycle.json" "$DB" <<'PY'
          import hashlib,json,sys
          report=json.load(open(sys.argv[1],encoding="utf-8"))
          hasher=hashlib.sha256()
          with open(sys.argv[2],"rb") as fh:
              for chunk in iter(lambda: fh.read(1024*1024),b""):
                  hasher.update(chunk)
          digest=hasher.hexdigest().upper()
          if report.get("stage5_pass") is not True:
              raise SystemExit("STAGE5_SAME_RUN_PASS=FALSE")
          counts=report.get("sync_result_counts") or {}
          if int(counts.get("committed") or 0)<1:
              raise SystemExit("STAGE5_SAME_RUN_COMMITTED_ZERO")
          if int(counts.get("technical_errors") or 0)!=0:
              raise SystemExit("STAGE5_SAME_RUN_TECHNICAL_ERRORS")
          if str(report.get("db_sha_after") or "").upper()!=digest:
              raise SystemExit("STAGE5_SAME_RUN_DB_SHA_MISMATCH")
          print("STAGE5_SAME_RUN_GATE=PASS")
          PY

          echo
          echo "========== STAGE6 -> TURSO =========="
          $SUDO install -o root -g root -m 0644 "$STAGE6_PATCH" "$STAGE6_WRAPPER"
          test "$(sha256sum "$STAGE6_WRAPPER" | awk '{print $1}')" = "$STAGE6_RECON"
          $SUDO -u oddshunter "$PY" - "$STAGE6_WRAPPER" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          compile(p.read_text(encoding="utf-8"), str(p), "exec")
          PY
          echo "STAGE6_RECONCILIATION_INSTALL=PASS"

          if $SUDO -u oddshunter env             TURSO_DATABASE_URL="$URL"             TURSO_AUTH_TOKEN="$TOK"             ODDSHUNTER_STAGE6_ALLOW_TURSO_WRITE=1             ODDSHUNTER_STAGE6_REQUIRED_MATCH_IDS="16596,29312,29332"             ODDSHUNTER_DISABLE_TRAINING=1             "$PY" -u "$STAGE6_WRAPPER"             > /tmp/stage6_result_sync_v6.log 2>&1; then
            STAGE6_RC=0
          else
            STAGE6_RC=$?
          fi

          cat /tmp/stage6_result_sync_v6.log
          echo "STAGE6_PROCESS_RC=$STAGE6_RC"
          test "$STAGE6_RC" -eq 0

          REPORT="$CUR/artifacts/cloud_stage6_publisher.json"
          test -f "$REPORT"

          $SUDO -u oddshunter "$PY" - "$REPORT" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          print("STAGE6_PASS =",d.get("stage6_pass"))
          if d.get("stage6_pass") is not True:
              raise SystemExit("STAGE6_PASS=FALSE")

          core=d.get("core_meta") or {}
          reconciliation=core.get("stats_reconciliation") or {}
          print("STATS_RECONCILIATION =",reconciliation)
          if reconciliation.get("delete_invoked") is not False:
              raise SystemExit("TURSO_STATS_RECONCILIATION_DELETE_POLICY_FAIL")
          if reconciliation.get("remote_only_rows") != 0:
              raise SystemExit("TURSO_STATS_RECONCILIATION_REMOTE_ONLY_ROWS")

          wanted={16596,29312,29332}
          required={int(x) for x in (core.get("required_match_ids") or [])}
          published={int(x) for x in (core.get("published_match_ids") or [])}
          print("REQUIRED_MATCH_IDS =",sorted(required))
          print("PUBLISHED_MATCH_IDS =",sorted(published))
          if not wanted.issubset(required):
              raise SystemExit(
                  f"TURSO_REQUIRED_TARGETS_MISSING missing={sorted(wanted-required)}"
              )
          if not wanted.issubset(published):
              raise SystemExit(
                  f"TURSO_PUBLISHED_TARGETS_MISSING missing={sorted(wanted-published)}"
              )
          # publish_rows() in Stage6 verifies every published remote match, all
          # columns, against the exact SQLite row before stage6_pass can be true.
          print("TURSO_THREE_RESULTS_GATE=PASS")
          PY

          $SUDO systemctl restart oddshunter.service
          sleep 5
          test "$($SUDO systemctl is-active oddshunter.service)" = "active"
          echo "SERVICE_RESTART=PASS"

          echo "F24_AFTER_SHA=$(sha256sum "$F24" | awk '{print $1}')"
          echo "SYNC_AFTER_SHA=$(sha256sum "$SYNC" | awk '{print $1}')"
          echo "STAGE5_AFTER_SHA=$(sha256sum "$STAGE5" | awk '{print $1}')"
          echo "RESULT_SYNC_SCOPE=ALL_KNOWN_REGISTRY_COMPETITIONS"
          echo "RESULT_SYNC_QUEUE=NEWEST_OLDEST_FAIR"
          echo "RESULT_SYNC_DEFAULT_TARGETS_PER_CYCLE=8"
          echo "FUTBOL24_DATE_IDENTITY=UTC_LOCAL_DATE_TOLERANCE"
          echo "FUTBOL24_ALIAS_BRIDGE=READ_ONLY_REGISTRY_ALIASES"

          trap - ERR
          echo "V6_SERVER_SIDE=PASS"
          REMOTE

      - name: Verificar API Mobile
        run: |
          set -euo pipefail
          mkdir -p api_probe_v6

          for TARGET in             "leagues-cup/16835069"             "usa-usl-championship/15285812"             "liga-betplay-colombia/16390710"
          do
            SAFE="${TARGET//\//_}"
            echo "===== $TARGET ====="

            curl               --fail               --silent               --show-error               --location               --connect-timeout 15               --max-time 45               -H 'Cache-Control: no-cache'               "https://oddshunter-mobile.vercel.app/api/match/$TARGET?cb=$(date +%s%N)"               -o "api_probe_v6/$SAFE.json"

            python3 -m json.tool "api_probe_v6/$SAFE.json" | head -n 160
          done

          echo "API_THREE_ENDPOINTS_HTTP_200=PASS"

      - name: Subir evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oddshunter-result-sync-hotfix-v6-evidence
          path: |
            RESULT_SYNC_HOTFIX_V6.txt
            api_probe_v6/
          if-no-files-found: warn
          retention-days: 7

      - name: Gate final
        run: |
          set -euo pipefail
          grep -q "DIRECT_SYNC_COMMITTED_GATE=PASS event_id=16835069" RESULT_SYNC_HOTFIX_V6.txt
          grep -q "DIRECT_SYNC_COMMITTED_GATE=PASS event_id=15285812" RESULT_SYNC_HOTFIX_V6.txt
          grep -q "DIRECT_SYNC_COMMITTED_GATE=PASS event_id=16390710" RESULT_SYNC_HOTFIX_V6.txt
          grep -q "RESULT_SYNC_IDENTITY_V6=PASS" RESULT_SYNC_HOTFIX_V6.txt
          grep -q "STAGE5_SAME_RUN_GATE=PASS" RESULT_SYNC_HOTFIX_V6.txt
          grep -q "THREE_RESULTS_SQLITE=PASS" RESULT_SYNC_HOTFIX_V6.txt
          grep -q "STAGE6_STATS_RECONCILIATION" RESULT_SYNC_HOTFIX_V6.txt
          grep -q "STAGE6_RECONCILIATION_INSTALL=PASS" RESULT_SYNC_HOTFIX_V6.txt
          grep -q "TURSO_THREE_RESULTS_GATE=PASS" RESULT_SYNC_HOTFIX_V6.txt
          grep -q "SERVICE_RESTART=PASS" RESULT_SYNC_HOTFIX_V6.txt
          grep -q "V6_SERVER_SIDE=PASS" RESULT_SYNC_HOTFIX_V6.txt
          echo "FINAL=PASS_ODDSHUNTER_RESULT_SYNC_HOTFIX_V6"
