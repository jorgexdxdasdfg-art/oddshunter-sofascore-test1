name: OddsHunter Analysis Queue Diagnostic
# DIAG_TRIGGER=20260912T042736Z
# LOG_DIAG_TRIGGER=20260912T051743Z
# HISTORY_DIAG_TRIGGER=20260912T052307Z
# RATINGS_SOURCE_TRIGGER=20260912T052807Z
# Read-only probe for the complete-fixture analysis rollout (post-refresh check).

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/oddshunter-analysis-queue-diagnostic.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_PORT_SECRET: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          PORT="${VPS_PORT_SECRET:-22}"
          echo "VPS_PORT=$PORT" >> "$GITHUB_ENV"
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/oddshunter_diag
          chmod 0600 ~/.ssh/oddshunter_diag
          ssh-keyscan -p "$PORT" -H "$VPS_HOST" > ~/.ssh/known_hosts

      - name: Read queue status
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          SSH=(ssh -i ~/.ssh/oddshunter_diag -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST")
          scp -i ~/.ssh/oddshunter_diag -P "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes fixture_analysis_runtime_diagnostic.py "$VPS_USER@$VPS_HOST:/tmp/fixture_analysis_runtime_diagnostic.py"
          STATUS="$("${SSH[@]}" '
            if [ "$(id -u)" -eq 0 ]; then SUDO=""; else SUDO="sudo -n"; fi
            CUR=$(readlink -f /opt/oddshunter/current)
            EPOCH=$(cat /tmp/oddshunter_complete_analysis_epoch 2>/dev/null || echo 0)
            ACTIVE=$($SUDO systemctl is-active oddshunter.service 2>/dev/null || true)
            LINE=$($SUDO journalctl -u oddshunter.service --since "@$EPOCH" --no-pager 2>/dev/null |
              tail -n 45 | tr "\n" " | " || true)
            SELECTOR=$($SUDO -u oddshunter "$CUR/.venv-cloud/bin/python" /tmp/fixture_analysis_runtime_diagnostic.py "$CUR" 2>&1 || true)
            SCHEDULE=$(cat "$CUR/data/automation/cloud_schedule_refresh/last.json" 2>/dev/null || true)
            SCHEDULE_JOURNAL=$($SUDO journalctl -u oddshunter-schedule-refresh.service -n 80 --no-pager 2>/dev/null | tr "\n" " | " || true)
            printf "service=%s schedule=%s selector=%s schedule_journal=%s journal=%s" "$ACTIVE" "$SCHEDULE" "$SELECTOR" "$SCHEDULE_JOURNAL" "$LINE"
          ')"
          STATUS="${STATUS//'%'/'%25'}"
          STATUS="${STATUS//$'\n'/'%0A'}"
          STATUS="${STATUS//$'\r'/'%0D'}"
          echo "::notice title=Analysis queue runtime::$STATUS"

          echo "========== DEEP STAGE5 DIAGNOSTIC =========="

          "${SSH[@]}" 'bash -s' <<'REMOTE'
          set -euo pipefail

          if [ "$(id -u)" -eq 0 ]; then
            SUDO=""
          else
            SUDO="sudo -n"
          fi

          CUR="$(readlink -f /opt/oddshunter/current)"
          PY="$CUR/.venv-cloud/bin/python"
          EPOCH="$(cat /tmp/oddshunter_complete_analysis_epoch 2>/dev/null || echo 0)"

          echo "========== STAGE5 REPORT =========="
          if [ -f "$CUR/artifacts/cloud_stage5_cycle.json" ]; then
            $SUDO -u oddshunter "$PY" - "$CUR/artifacts/cloud_stage5_cycle.json" <<'PY'
          import json,sys

          path=sys.argv[1]
          d=json.load(open(path,encoding="utf-8"))

          for key in (
              "stage5_pass",
              "analysis_target_count",
              "analysis_result_counts",
              "criteria",
              "result",
              "error",
              "errors",
          ):
              print(key,"=",d.get(key))

          for key in (
              "analysis_targets",
              "selected_analysis_targets",
              "analysis_results",
          ):
              value=d.get(key)
              if value is not None:
                  print(
                      key+"=",
                      json.dumps(
                          value,
                          ensure_ascii=False,
                          default=str,
                      )[:30000],
                  )
          PY
          else
            echo "STAGE5_REPORT_MISSING=YES"
          fi

          echo "========== TARGET FILE STATE =========="

          $SUDO -u oddshunter "$PY" - "$CUR" <<'PY'
          import json
          import sqlite3
          import sys
          from pathlib import Path

          root=Path(sys.argv[1])
          sys.path.insert(0,str(root))

          from fixture_analysis_queue import (
              has_visible_characteristics,
              load_schedule_seed_fixture_rows,
          )

          target_ids={
              15285834,
              15285843,
              16317939,
              16361914,
              16483673,
          }

          registry=json.loads(
              (root/"data"/"competitions.json").read_text(
                  encoding="utf-8-sig"
              )
          )

          active=[
              x for x in registry.get("competitions",[])
              if isinstance(x,dict) and x.get("active")
          ]

          by_league={
              int(x["league_id"]):x
              for x in active
              if x.get("league_id") is not None
          }

          seed_rows=load_schedule_seed_fixture_rows(
              Path(
                  "/var/lib/oddshunter/data/"
                  "mobile_schedule_catalog_seed.json.gz"
              ),
              by_league,
          )

          seed_by_id={}
          for raw in seed_rows:
              row=dict(raw)
              try:
                  event_id=int(row.get("sofascore_id") or 0)
              except Exception:
                  continue
              if event_id in target_ids:
                  seed_by_id[event_id]=row

          db=root/"data"/"oddshunter.db"
          con=sqlite3.connect(db)
          con.row_factory=sqlite3.Row

          db_rows={}
          placeholders=",".join("?" for _ in target_ids)

          for row in con.execute(
              f"""
              SELECT
                  m.sofascore_id,
                  m.league_id,
                  m.kickoff,
                  m.status,
                  m.season,
                  h.sofascore_id AS home_team_id,
                  h.name AS home_team,
                  a.sofascore_id AS away_team_id,
                  a.name AS away_team
              FROM matches m
              JOIN teams h ON h.team_id=m.home_team_id
              JOIN teams a ON a.team_id=m.away_team_id
              WHERE m.sofascore_id IN ({placeholders})
              """,
              tuple(sorted(target_ids)),
          ):
              db_rows[int(row["sofascore_id"])]=dict(row)

          con.close()

          analysis_root=root/"data"/"analisis"

          for event_id in sorted(target_ids):
              row=db_rows.get(event_id) or seed_by_id.get(event_id) or {}

              league_id=int(row.get("league_id") or 0)
              comp=by_league.get(league_id) or {}
              key=str(comp.get("key") or "")

              folder=(
                  analysis_root/key/str(event_id)
                  if key
                  else None
              )

              print(
                  "TARGET_ROW=",
                  json.dumps(
                      {
                          "event_id":event_id,
                          "source":"db" if event_id in db_rows else "seed",
                          "competition_key":key,
                          "league_id":league_id,
                          "home_team_id":row.get("home_team_id"),
                          "home_team":row.get("home_team"),
                          "away_team_id":row.get("away_team_id"),
                          "away_team":row.get("away_team"),
                          "kickoff":row.get("kickoff"),
                          "status":row.get("status"),
                          "visible":(
                              has_visible_characteristics(
                                  analysis_root,
                                  key,
                                  event_id,
                              )
                              if key else False
                          ),
                      },
                      ensure_ascii=False,
                  )
              )

              if not folder or not folder.is_dir():
                  print("TARGET_FOLDER_MISSING=",event_id)
                  continue

              print(
                  "TARGET_FILES=",
                  event_id,
                  sorted(p.name for p in folder.iterdir()),
              )

              for name in (
                  "status.json",
                  "analysis.json",
                  "goals.json",
              ):
                  path=folder/name

                  if not path.is_file():
                      continue

                  try:
                      doc=json.loads(
                          path.read_text(encoding="utf-8-sig")
                      )
                  except Exception as exc:
                      print(
                          "TARGET_DOC_ERROR=",
                          event_id,
                          name,
                          type(exc).__name__,
                          str(exc),
                      )
                      continue

                  if isinstance(doc,dict):
                      print(
                          "TARGET_DOC=",
                          event_id,
                          name,
                          json.dumps(
                              {
                                  "status":doc.get("status"),
                                  "analysis_status":doc.get(
                                      "analysis_status"
                                  ),
                                  "error":doc.get("error"),
                                  "reason":doc.get("reason"),
                              },
                              ensure_ascii=False,
                          ),
                      )
          PY

          echo "========== TARGET TEAM HISTORY COVERAGE =========="

          $SUDO -u oddshunter "$PY" - "$CUR" <<'PY'
          import sqlite3
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          con = sqlite3.connect(root / "data" / "oddshunter.db")
          con.row_factory = sqlite3.Row

          targets = {
              197065: "Colorado Springs Switchbacks FC",
              217134: "San Antonio FC",
              310531: "New Mexico United",
              148992: "Indy Eleven",
              36525: "Club Tijuana",
              1951: "Quer?taro FC",
              5044: "KV Mechelen",
              2900: "RSC Anderlecht",
              3050: "Be?ikta? JK",
              55603: "Erzurumspor FK",
          }

          for sid, expected_name in targets.items():
              rows = con.execute(
                  """
                  SELECT team_id,name,sofascore_id
                  FROM teams
                  WHERE sofascore_id=?
                  """,
                  (sid,),
              ).fetchall()

              print("TEAM_TARGET", sid, expected_name)

              if not rows:
                  print("TEAM_BY_SOFASCORE=MISSING")
                  continue

              for row in rows:
                  team_id = int(row["team_id"])

                  home = con.execute(
                      "SELECT COUNT(*) FROM matches WHERE home_team_id=?",
                      (team_id,),
                  ).fetchone()[0]

                  away = con.execute(
                      "SELECT COUNT(*) FROM matches WHERE away_team_id=?",
                      (team_id,),
                  ).fetchone()[0]

                  leagues = [
                      x[0]
                      for x in con.execute(
                          """
                          SELECT DISTINCT league_id
                          FROM matches
                          WHERE home_team_id=? OR away_team_id=?
                          ORDER BY league_id
                          """,
                          (team_id, team_id),
                      ).fetchall()
                  ]

                  print(
                      "TEAM_DB=",
                      {
                          "team_id": team_id,
                          "db_name": row["name"],
                          "sofascore_id": row["sofascore_id"],
                          "home_matches": home,
                          "away_matches": away,
                          "total_matches": home + away,
                          "league_ids": leagues,
                      },
                  )

          con.close()
          PY

          echo "========== RATINGS FAILURE SOURCE =========="

          MATCHES="$(
            grep -RIl \
              --include='*.py' \
              'No hay partidos guardados para' \
              "$CUR" 2>/dev/null || true
          )"

          if [ -z "$MATCHES" ]; then
            echo "RATINGS_ERROR_SOURCE_NOT_FOUND"
          else
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              echo "SOURCE_FILE=$file"

              line="$(
                grep -n \
                  'No hay partidos guardados para' \
                  "$file" |
                head -n 1 |
                cut -d: -f1
              )"

              start=$((line-80))
              [ "$start" -lt 1 ] && start=1
              end=$((line+80))

              nl -ba "$file" |
                sed -n "${start},${end}p"
            done <<< "$MATCHES"
          fi

          echo "========== TEAM_MATCH_STATS SCHEMA =========="

          $SUDO -u oddshunter "$PY" - "$CUR/data/oddshunter.db" <<'PY'
          import sqlite3,sys

          con=sqlite3.connect(sys.argv[1])

          print(
              "TEAM_MATCH_STATS_SQL=",
              con.execute(
                  """
                  SELECT sql
                  FROM sqlite_master
                  WHERE type='table'
                    AND name='team_match_stats'
                  """
              ).fetchone()
          )

          print(
              "TEAM_MATCH_STATS_COLUMNS=",
              con.execute(
                  "PRAGMA table_info(team_match_stats)"
              ).fetchall()
          )

          print(
              "TEAM_MATCH_STATS_FKS=",
              con.execute(
                  "PRAGMA foreign_key_list(team_match_stats)"
              ).fetchall()
          )

          con.close()
          PY

          echo "========== TARGET ANALYSIS LOG FILES =========="

          $SUDO -u oddshunter "$PY" - "$CUR" <<'PY'
          import sys
          from pathlib import Path

          root=Path(sys.argv[1])

          targets = {
              ("usa-usl-championship",15285834),
              ("usa-usl-championship",15285843),
              ("ligamx-apertura",16317939),
              ("belgium-pro-league",16361914),
              ("turkey-super-lig",16483673),
          }

          for key,event_id in targets:
              folder=root/"data"/"analisis"/key/str(event_id)/"logs"

              print("LOG_TARGET",event_id,key)

              if not folder.is_dir():
                  print("LOG_DIR_MISSING",event_id)
                  continue

              files=sorted(
                  [p for p in folder.rglob("*") if p.is_file()],
                  key=lambda p: p.stat().st_mtime,
              )

              if not files:
                  print("LOG_FILES_EMPTY",event_id)
                  continue

              for path in files[-10:]:
                  print(
                      "===== LOG_FILE",
                      event_id,
                      path.relative_to(folder),
                      "====="
                  )

                  try:
                      text=path.read_text(
                          encoding="utf-8",
                          errors="replace",
                      )
                  except Exception as exc:
                      print("LOG_READ_ERROR",type(exc).__name__,str(exc))
                      continue

                  lines=text.splitlines()
                  for line in lines[-250:]:
                      print(line)
          PY

          echo "========== STAGE5 JOURNAL =========="

          $SUDO journalctl \
            -u oddshunter.service \
            --since "@$EPOCH" \
            --no-pager 2>/dev/null |
            grep -Eia \
              'STAGE5>|15285834|15285843|16317939|16361914|16483673|Traceback|Exception|ERROR|CYCLE=' |
            tail -n 800 || true

          REMOTE
