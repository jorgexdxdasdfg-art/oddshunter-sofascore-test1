name: OddsHunter FINAL Score Sync Repair DEPLOY V3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Construir Stage5 V3 exacto
        run: |
          set -euo pipefail
          : > stage5_patch.b64
          printf '%s' '' >> stage5_patch.b64
          printf '%s' '' >> stage5_patch.b64
          printf '%s' '' >> stage5_patch.b64
          printf '%s' '' >> stage5_patch.b64
          printf '%s' '' >> stage5_patch.b64
          printf '%s' '' >> stage5_patch.b64
          printf '%s' '' >> stage5_patch.b64
          printf '%s' '' >> stage5_patch.b64
          printf '%s' '' >> stage5_patch.b64
          base64 -d stage5_patch.b64 > cloud_stage5_cycle.py
          rm -f stage5_patch.b64
          GOT="$(sha256sum cloud_stage5_cycle.py | awk '{print $1}')"
          test "$GOT" = "b35251d6d47232e7bc6aeadc4c19f804fe13cc702813054cdd5c74ec426f76e3"
          python3 - <<'PY'
          from pathlib import Path
          p=Path("cloud_stage5_cycle.py")
          compile(p.read_text(encoding="utf-8"), str(p), "exec")
          print("LOCAL_SYNTAX=PASS")
          PY
          echo "PATCH_SHA256=$GOT"

      - name: Preparar SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_PORT_SECRET: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          test -n "${VPS_HOST:-}"
          test -n "${VPS_SSH_PRIVATE_KEY:-}"
          PORT="${VPS_PORT_SECRET:-22}"
          echo "VPS_PORT=$PORT" >> "$GITHUB_ENV"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/oddshunter_finalfix
          chmod 600 ~/.ssh/oddshunter_finalfix
          ssh-keygen -y -f ~/.ssh/oddshunter_finalfix >/dev/null
          ssh-keyscan -p "$PORT" -H "$VPS_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          echo "SSH=PASS"

      - name: Copiar Stage5 V3 al VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/oddshunter_finalfix -P "$VPS_PORT"             -o BatchMode=yes -o StrictHostKeyChecking=yes             cloud_stage5_cycle.py             "$VPS_USER@$VPS_HOST:/tmp/cloud_stage5_cycle_SCORE_FAIRNESS_V3.py"

      - name: Aplicar V3 + sincronizar EXACTAMENTE los 3 partidos
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/oddshunter_finalfix -p "$VPS_PORT"             -o BatchMode=yes -o StrictHostKeyChecking=yes             "$VPS_USER@$VPS_HOST"             "EXPECTED='b4b93b0edc6e864bafeed77a1b019426c09ce88834d84edf000568bf0abb2cb0' PATCHED='b35251d6d47232e7bc6aeadc4c19f804fe13cc702813054cdd5c74ec426f76e3' bash -s" <<'REMOTE' | tee repair_stage5.txt
          set -euo pipefail
          if [ "$(id -u)" -eq 0 ]; then SUDO=""; else SUDO="sudo -n"; fi

          CUR="$(readlink -f /opt/oddshunter/current)"
          TARGET="$CUR/cloud_stage5_cycle.py"
          DB="$CUR/data/oddshunter.db"
          PY="$CUR/.venv-cloud/bin/python"
          PATCH="/tmp/cloud_stage5_cycle_SCORE_FAIRNESS_V3.py"
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          SRC_BAK="$CUR/cloud_stage5_cycle.py.PRE_SCORE_FAIRNESS_V3_$STAMP"
          DB_BAK="/var/lib/oddshunter/data/oddshunter.db.PRE_SCORE_FAIRNESS_V3_$STAMP"

          echo "CURRENT=$CUR"
          BEFORE="$(sha256sum "$TARGET" | awk '{print $1}')"
          echo "STAGE5_BEFORE_SHA=$BEFORE"
          if [ "$BEFORE" != "$EXPECTED" ] && [ "$BEFORE" != "$PATCHED" ]; then
            echo "SOURCE_DRIFT=YES"
            exit 21
          fi

          $SUDO systemctl stop oddshunter.service
          echo "SERVICE_STOPPED=YES"

          $SUDO cp -a "$TARGET" "$SRC_BAK"
          $SUDO cp -a "$DB" "$DB_BAK"
          echo "SOURCE_BACKUP=$SRC_BAK"
          echo "DB_BACKUP=$DB_BAK"

          rollback() {
            echo "ROLLBACK=START"
            $SUDO cp -a "$SRC_BAK" "$TARGET" || true
            $SUDO cp -a "$DB_BAK" "$DB" || true
            $SUDO chown oddshunter:oddshunter "$DB" || true
            $SUDO systemctl restart oddshunter.service || true
            echo "ROLLBACK=DONE"
          }
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then rollback; fi; exit "$rc"' EXIT

          $SUDO install -o root -g root -m 0644 "$PATCH" "$TARGET"
          AFTER="$(sha256sum "$TARGET" | awk '{print $1}')"
          test "$AFTER" = "$PATCHED"
          echo "STAGE5_PATCH=PASS"

          $SUDO -u oddshunter "$PY" - "$TARGET" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          compile(p.read_text(encoding="utf-8"), str(p), "exec")
          print("REMOTE_SYNTAX=PASS")
          PY

          echo "=== BEFORE TARGETS ==="
          $SUDO -u oddshunter "$PY" - "$DB" <<'PY'
          import sqlite3,sys
          ids=(16835069,15285812,16390710)
          con=sqlite3.connect(f"file:{sys.argv[1]}?mode=ro",uri=True)
          con.row_factory=sqlite3.Row
          for r in con.execute(
              "SELECT match_id,sofascore_id,kickoff,status,home_goals,away_goals "
              "FROM matches WHERE sofascore_id IN (?,?,?) ORDER BY sofascore_id",ids):
              print(dict(r))
          con.close()
          PY

          set +e
          $SUDO -u oddshunter env             ODDSHUNTER_RUNTIME_MODE=cloud             ODDSHUNTER_ALLOW_WORK_DB_WRITE=1             ODDSHUNTER_DISABLE_TRAINING=1             ODDSHUNTER_BROWSER_HEADLESS=1             ODDSHUNTER_CHROMIUM_SANDBOX=0             ODDSHUNTER_FLASHSCORE_MAX_MATCHES_PER_CYCLE=4             ODDSHUNTER_RESULT_SYNC_TARGET_LIMIT=3             ODDSHUNTER_RESULT_SYNC_MAX_ATTEMPTS=120             ODDSHUNTER_RESULT_SYNC_PRIORITY_EVENT_IDS="16835069,15285812,16390710"             "$PY" -u "$TARGET" > /tmp/oddshunter_stage5_v3_manual.log 2>&1
          RC=$?
          set -e

          tail -n 220 /tmp/oddshunter_stage5_v3_manual.log
          echo "STAGE5_MANUAL_RC=$RC"
          test "$RC" -eq 0

          REPORT="$CUR/artifacts/cloud_stage5_cycle.json"
          test -f "$REPORT"

          $SUDO -u oddshunter "$PY" - "$REPORT" "$DB" <<'PY'
          import json,sqlite3,sys
          report=json.load(open(sys.argv[1],encoding="utf-8"))
          wanted={16835069,15285812,16390710}
          selected={int(x["event_id"]) for x in report.get("selected_sync_targets",[])}
          print("SELECTED_IDS =",sorted(selected))
          print("WANTED_IDS =",sorted(wanted))
          if not wanted.issubset(selected):
              raise SystemExit("FORCED_TARGET_SELECTION=FAIL")

          expected={
              16835069:(2,0),
              15285812:(2,1),
              16390710:(2,1),
          }
          con=sqlite3.connect(f"file:{sys.argv[2]}?mode=ro",uri=True)
          con.row_factory=sqlite3.Row
          rows={int(r["sofascore_id"]):dict(r) for r in con.execute(
              "SELECT match_id,sofascore_id,status,home_goals,away_goals "
              "FROM matches WHERE sofascore_id IN (?,?,?)",
              tuple(sorted(wanted))
          )}
          for eid in sorted(wanted):
              r=rows.get(eid)
              print("AFTER_TARGET =",r)
              if not r:
                  raise SystemExit(f"MISSING_TARGET={eid}")
              got=(r["home_goals"],r["away_goals"])
              if got != expected[eid]:
                  raise SystemExit(f"SCORE_MISMATCH eid={eid} got={got} expected={expected[eid]}")
              if str(r["status"] or "").upper() not in {"FT","AET","PEN","FINISHED","FINAL"}:
                  raise SystemExit(f"STATUS_NOT_TERMINAL eid={eid} status={r['status']}")
          print("THREE_FINAL_SCORES_GATE=PASS")
          print("STAGE5_PASS =",report.get("stage5_pass"))
          print("SYNC_RESULT_COUNTS =",report.get("sync_result_counts"))
          con.close()
          PY

          echo "STAGE5_TARGET_REPAIR=PASS"
          trap - EXIT
          REMOTE

      - name: Publicar esos cambios a Turso
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          URL64="$(printf '%s' "$TURSO_DATABASE_URL" | base64 -w0)"
          TOK64="$(printf '%s' "$TURSO_AUTH_TOKEN" | base64 -w0)"

          ssh -i ~/.ssh/oddshunter_finalfix -p "$VPS_PORT"             -o BatchMode=yes -o StrictHostKeyChecking=yes             "$VPS_USER@$VPS_HOST"             "URL64='$URL64' TOK64='$TOK64' bash -s" <<'REMOTE' | tee publish_turso.txt
          set -euo pipefail
          if [ "$(id -u)" -eq 0 ]; then SUDO=""; else SUDO="sudo -n"; fi
          CUR="$(readlink -f /opt/oddshunter/current)"
          PY="$CUR/.venv-cloud/bin/python"

          restart_service() {
            $SUDO systemctl restart oddshunter.service || true
          }
          trap restart_service EXIT

          URL="$(printf '%s' "$URL64" | base64 -d)"
          TOK="$(printf '%s' "$TOK64" | base64 -d)"

          $SUDO -u oddshunter env             TURSO_DATABASE_URL="$URL"             TURSO_AUTH_TOKEN="$TOK"             ODDSHUNTER_STAGE6_ALLOW_TURSO_WRITE=1             ODDSHUNTER_DISABLE_TRAINING=1             "$PY" -u "$CUR/cloud_stage6_publish.py"             > /tmp/oddshunter_stage6_v3_manual.log 2>&1

          tail -n 220 /tmp/oddshunter_stage6_v3_manual.log

          REPORT="$CUR/artifacts/cloud_stage6_publisher.json"
          test -f "$REPORT"
          $SUDO -u oddshunter "$PY" - "$REPORT" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          wanted={16596,29312,29332}
          core=d.get("core_meta") or {}
          published={int(x) for x in core.get("published_match_ids",[]) or []}
          print("PUBLISHED_MATCH_IDS =",sorted(published))
          print("WANTED_MATCH_IDS =",sorted(wanted))
          if not wanted.issubset(published):
              raise SystemExit("TURSO_PUBLISHED_TARGETS=FAIL")
          if d.get("stage6_pass") is not True:
              raise SystemExit("STAGE6_PASS=FALSE")
          print("TURSO_PUBLISHED_TARGETS=PASS")
          print("STAGE6_PASS=True")
          PY

          $SUDO systemctl restart oddshunter.service
          sleep 5
          test "$($SUDO systemctl is-active oddshunter.service)" = "active"
          echo "SERVICE_RESTART=PASS"
          trap - EXIT
          REMOTE

      - name: Probar Vercel para los 3 partidos
        run: |
          set -euo pipefail
          mkdir -p vercel_probes
          for TARGET in             "leagues-cup/16835069"             "usa-usl-championship/15285812"             "liga-betplay-colombia/16390710"
          do
            SAFE="${TARGET//\//_}"
            curl --silent --show-error --location               --connect-timeout 15 --max-time 45               -H 'Cache-Control: no-cache'               "https://oddshunter-mobile.vercel.app/api/match/$TARGET?cb=$(date +%s)"               -o "vercel_probes/$SAFE.json" || true
            echo "===== $TARGET ====="
            head -c 5000 "vercel_probes/$SAFE.json" || true
            echo
          done

      - name: Subir evidencia final
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oddshunter-FINAL-score-sync-repair-v3-evidence
          path: |
            repair_stage5.txt
            publish_turso.txt
            vercel_probes/
          if-no-files-found: warn
          retention-days: 7

      - name: Gate final
        run: |
          set -euo pipefail
          grep -q "STAGE5_TARGET_REPAIR=PASS" repair_stage5.txt
          grep -q "THREE_FINAL_SCORES_GATE=PASS" repair_stage5.txt
          grep -q "TURSO_PUBLISHED_TARGETS=PASS" publish_turso.txt
          grep -q "SERVICE_RESTART=PASS" publish_turso.txt
          echo "FINAL=PASS_ODDSHUNTER_SCORE_SYNC_REPAIR_V3"
