name: OddsHunter - adapter 24score en cadena (aislado)
on:
  push:
    branches:
      - lab/odds-chain-4markets-20261009
    paths:
      - odds_24score_adapter_lab.py
      - tests/test_odds_24score_adapter_lab.py
      - .github/workflows/oddshunter-24score-adapter-tests.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test_adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify adapter and cascaded validation
        run: python -m unittest discover -s tests -p test_odds_24score_adapter_lab.py -v
