name: OddsHunter - OVH 4 Markets Read Only
on:
  push:
    branches:
      - audit/cuotas-4-mercados-20261008
    paths:
      - .github/workflows/oddshunter-ovh-4-markets-readonly.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_PORT_SECRET: ${{ secrets.VPS_PORT }}
    steps:
      - name: Comprobar acceso de solo lectura a OVH
        run: |
          set -euo pipefail
          test -n "${VPS_HOST:-}"
          test -n "${VPS_USER:-}"
          test -n "${VPS_SSH_PRIVATE_KEY:-}"
          port="${VPS_PORT_SECRET:-22}"
          echo "VPS_PORT=$port" >> "$GITHUB_ENV"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/oddshunter_audit"
          chmod 600 "$HOME/.ssh/oddshunter_audit"
          ssh-keyscan -p "$port" -H "$VPS_HOST" > "$HOME/.ssh/known_hosts"
      - name: Auditoria de tablas de cuotas (sin escritura)
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/oddshunter_audit" -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'if [ "$(id -u)" -eq 0 ]; then exec python3 -; else exec sudo -n python3 -; fi' <<'PY'
          import json, os, sqlite3
          from datetime import datetime, timezone, timedelta

          paths = [
              "/var/lib/oddshunter-hybrid/runtime/data/oddshunter.db",
              "/var/lib/oddshunter/data/oddshunter.db",
              "/opt/oddshunter/current/data/oddshunter.db",
          ]
          output = {
              "audit": "READ_ONLY",
              "runtime_script_exists": os.path.isfile("/opt/oddshunter/current/five_dollar_odds_sync.py"),
              "databases": [],
          }
          now = datetime.now(timezone.utc)
          for path in paths:
              if not os.path.isfile(path):
                  continue
              item = {"path": path}
              try:
                  connection = sqlite3.connect(f"file:{path}?mode=ro", uri=True, timeout=10)
                  names = {r[0] for r in connection.execute(
                      "SELECT name FROM sqlite_master WHERE type='table'"
                  )}
                  item["odds_tables_present"] = {"bet365_odds_state","bet365_fixture_odds_sync"}.issubset(names)
                  if item["odds_tables_present"]:
                      categories = {
                          "goals": ("goals_over_%","goals_under_%"),
                          "corners": ("corners_over_%","corners_under_%"),
                          "cards": ("cards_over_%","cards_under_%"),
                          "btts": ("btts_yes","btts_no"),
                      }
                      counts = {}
                      for name, (side1, side2) in categories.items():
                          totals = []
                          for key in (side1, side2):
                              totals.append(connection.execute(
                                  "SELECT COUNT(*) FROM bet365_odds_state WHERE market_key LIKE ? AND current_odds>1",
                                  (key,)
                              ).fetchone()[0])
                          counts[name] = {"side_1": totals[0], "side_2": totals[1]}
                      item["actual_quote_counts"] = counts
                      item["sync_status"] = dict(connection.execute(
                          "SELECT status,COUNT(*) FROM bet365_fixture_odds_sync GROUP BY status"
                      ).fetchall())
                      sample = connection.execute(
                          """SELECT s.competition_key,s.event_id,s.kickoff,
                                    GROUP_CONCAT(DISTINCT o.market_key)
                               FROM bet365_fixture_odds_sync s
                               JOIN bet365_odds_state o
                                 ON o.competition_key=s.competition_key AND o.event_id=s.event_id
                              WHERE o.current_odds>1
                              GROUP BY s.competition_key,s.event_id,s.kickoff
                              ORDER BY s.kickoff DESC LIMIT 250"""
                      ).fetchall()
                      full, future = 0, 0
                      for key,event,kickoff,markets in sample:
                          found = set((markets or "").split(","))
                          valid = all(
                              any(x.startswith(prefix) for x in found)
                              for prefix in ("goals_over_","goals_under_","corners_over_",
                                             "corners_under_","cards_over_","cards_under_")
                          ) and {"btts_yes","btts_no"}.issubset(found)
                          if valid:
                              full += 1
                              try:
                                  dt=datetime.fromisoformat(str(kickoff).replace("Z","+00:00"))
                                  if dt.tzinfo is None: dt=dt.replace(tzinfo=timezone.utc)
                                  future += int(now < dt <= now+timedelta(days=7))
                              except ValueError: pass
                      item["complete_four_market_matches_in_sample"] = full
                      item["complete_four_market_upcoming_7d_in_sample"] = future
                  connection.close()
              except Exception as exc:
                  item["error_type"] = type(exc).__name__
              output["databases"].append(item)
          print(json.dumps(output, sort_keys=True, ensure_ascii=False))
          PY

      - name: Diagnosticar frescura y proximos 7 dias (solo SELECT)
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/oddshunter_audit" -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'if [ "$(id -u)" -eq 0 ]; then exec python3 -; else exec sudo -n python3 -; fi' <<'PY'
          import os,sqlite3,json,datetime,subprocess
          out={}
          for p in ("/var/lib/oddshunter-hybrid/runtime/data/oddshunter.db",
                    "/var/lib/oddshunter/data/oddshunter.db",
                    "/opt/oddshunter/current/data/oddshunter.db"):
              if not os.path.isfile(p): continue
              db=sqlite3.connect("file:"+p+"?mode=ro",uri=True,timeout=10)
              t={"real_path":os.path.realpath(p),"size":os.stat(p).st_size,
                 "last_modified_utc":datetime.datetime.fromtimestamp(os.stat(p).st_mtime,datetime.timezone.utc).isoformat()}
              if db.execute("SELECT COUNT(*) FROM sqlite_master WHERE name='bet365_fixture_odds_sync'").fetchone()[0]:
                  t["latest_sync_timestamp"]=db.execute("SELECT MAX(last_checked_at) FROM bet365_fixture_odds_sync").fetchone()[0]
                  t["upcoming_7days_sync_status"]=dict(db.execute(
                      """SELECT status,COUNT(*) FROM bet365_fixture_odds_sync
                         WHERE datetime(kickoff)>=datetime('now')
                           AND datetime(kickoff)<datetime('now','+7 days')
                         GROUP BY status""").fetchall())
                  t["upcoming_sample"]=[dict(zip(("kickoff","home","away","status","checked_at"),v)) for v in db.execute(
                      """SELECT kickoff,home_team,away_team,status,last_checked_at
                         FROM bet365_fixture_odds_sync
                         WHERE datetime(kickoff)>=datetime('now') AND datetime(kickoff)<datetime('now','+7 days')
                         ORDER BY kickoff LIMIT 10""").fetchall()]
              db.close()
              out[p]=t
          units=subprocess.run(["systemctl","list-timers","--all","--no-pager"],capture_output=True,text=True,timeout=12)
          out["timers"]= [line[:180] for line in units.stdout.splitlines() if "oddshunter" in line.lower()][:20]
          print(json.dumps({"audit":"READ_ONLY_FRESHNESS","results":out},sort_keys=True,ensure_ascii=False))
          PY

      - name: Identificar servicio activo y sincronizador de cuotas (sin cambios)
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/oddshunter_audit" -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'if [ "$(id -u)" -eq 0 ]; then exec python3 -; else exec sudo -n python3 -; fi' <<'PY'
          import json,os,subprocess
          units=["oddshunter.service","oddshunter-hybrid-sync.service",
                 "oddshunter-live-sync.service","oddshunter-odds-sync.service"]
          out={"services":[],"odds_files":{}}
          for unit in units:
              r=subprocess.run(["systemctl","show",unit,"--no-pager",
                    "--property=LoadState,ActiveState,SubState,WorkingDirectory,FragmentPath,ExecMainStartTimestamp"],
                    capture_output=True,text=True,timeout=12)
              out["services"].append({"unit":unit,"properties":r.stdout.strip().splitlines()})
          for unit in ("oddshunter.service","oddshunter-hybrid-sync.service"):
              r=subprocess.run(["systemctl","cat",unit],capture_output=True,text=True,timeout=12)
              out[unit+"_commands"]=[line.strip()[:260] for line in r.stdout.splitlines()
                    if line.strip().startswith(("ExecStart=","WorkingDirectory=","Description="))][:12]
          for p in ("/opt/oddshunter/current/five_dollar_odds_sync.py",
                    "/opt/oddshunter/current/stage8_daemon.py",
                    "/etc/systemd/system/oddshunter-odds-sync.timer",
                    "/etc/systemd/system/oddshunter-odds-sync.service"):
              if not os.path.isfile(p):continue
              info={"exists":True,"bytes":os.stat(p).st_size}
              if p.endswith("stage8_daemon.py"):
                  body=open(p,encoding="utf-8",errors="replace").read()
                  info["odds_sync_hook"]=("five_dollar_odds_sync" in body)
                  info["odds_marker"]=("ODDS_VALUE_TODAY_TOMORROW_V3" in body)
              out["odds_files"][p]=info
          print(json.dumps({"audit":"READ_ONLY_SERVICES","results":out},ensure_ascii=False))
          PY
