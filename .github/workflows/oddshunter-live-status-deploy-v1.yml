name: OddsHunter LIVE STATUS DEPLOY V1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - cloud_live_status_sync.py
      - futbol24_client.py
      - sofascore_event_client.py
      - deploy/oddshunter-live-sync.service
      - deploy/oddshunter-live-sync.timer
      - tests/test_cloud_live_status_sync.py
      - tests/test_futbol24_resolver.py
      - .github/workflows/oddshunter-live-status-deploy-v1.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probar sincronizador live
        run: |
          set -eEuo pipefail
          python -m pip install --quiet pytest
          python -m py_compile cloud_live_status_sync.py sofascore_event_client.py
          python -m pytest -q tests/test_cloud_live_status_sync.py tests/test_futbol24_resolver.py tests/test_sofascore_event_client.py

      - name: Preparar SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_PORT_SECRET: ${{ secrets.VPS_PORT }}
        run: |
          set -eEuo pipefail
          test -n "${VPS_HOST:-}"
          test -n "${VPS_SSH_PRIVATE_KEY:-}"
          PORT="${VPS_PORT_SECRET:-22}"
          echo "VPS_PORT=$PORT" >> "$GITHUB_ENV"
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/oddshunter_live
          chmod 0600 ~/.ssh/oddshunter_live
          ssh-keyscan -p "$PORT" -H "$VPS_HOST" > ~/.ssh/known_hosts

      - name: Copiar archivos al VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eEuo pipefail
          scp -i ~/.ssh/oddshunter_live -P "$VPS_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            cloud_live_status_sync.py \
            "$VPS_USER@$VPS_HOST:/tmp/cloud_live_status_sync_V1.py"
          scp -i ~/.ssh/oddshunter_live -P "$VPS_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            futbol24_client.py \
            "$VPS_USER@$VPS_HOST:/tmp/futbol24_client_V1.py"
          scp -i ~/.ssh/oddshunter_live -P "$VPS_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            sofascore_event_client.py \
            "$VPS_USER@$VPS_HOST:/tmp/sofascore_event_client_V1.py"
          scp -i ~/.ssh/oddshunter_live -P "$VPS_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            deploy/oddshunter-live-sync.service \
            deploy/oddshunter-live-sync.timer \
            "$VPS_USER@$VPS_HOST:/tmp/"

      - name: Instalar, ejecutar y verificar
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eEuo pipefail
          ssh -i ~/.ssh/oddshunter_live -p "$VPS_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" 'bash -s' 2>&1 <<'REMOTE' | tee live_deploy_evidence.txt
          set -eEuo pipefail
          echo "SSH_REMOTE=PASS"
          if [ "$(id -u)" -eq 0 ]; then SUDO=""; else SUDO="sudo -n"; fi
          $SUDO true
          echo "SUDO_GATE=PASS"

          CUR="$(readlink -f /opt/oddshunter/current)"
          DB="/var/lib/oddshunter/data/oddshunter.db"
          PY="$CUR/.venv-cloud/bin/python"
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          BACKUP="/var/lib/oddshunter/data/oddshunter.db.PRE_LIVE_V1_$STAMP"

          echo "CURRENT=$CUR"
          if ! $SUDO test -f "$DB"; then
            echo "MISSING_DB=$DB"
            echo "CURRENT_DATA_LISTING_START"
            $SUDO ls -la "$CUR/data" || true
            echo "CURRENT_DATA_LISTING_END"
            echo "DB_CANDIDATES_START"
            $SUDO find /var/lib/oddshunter -maxdepth 4 -type f -name 'oddshunter.db*' -printf '%TY-%Tm-%TdT%TH:%TM:%TSZ %s %p\n' 2>/dev/null | sort -r | head -30 || true
            echo "DB_CANDIDATES_END"
            exit 41
          fi
          if ! $SUDO test -x "$PY"; then echo "MISSING_PYTHON=$PY"; exit 42; fi
          if ! $SUDO test -f /etc/oddshunter/oddshunter.env; then
            echo "MISSING_ENV=/etc/oddshunter/oddshunter.env"
            exit 43
          fi
          echo "REMOTE_PATHS=PASS"
          echo "DB_BACKUP=$BACKUP"
          $SUDO cp -a "$DB" "$BACKUP"

          if [ -f "$CUR/cloud_live_status_sync.py" ]; then
            $SUDO cp -a "$CUR/cloud_live_status_sync.py" \
              "$CUR/cloud_live_status_sync.py.PRE_LIVE_V1_$STAMP"
          fi
          if [ -f "$CUR/futbol24_client.py" ]; then
            $SUDO cp -a "$CUR/futbol24_client.py" \
              "$CUR/futbol24_client.py.PRE_LIVE_V1_$STAMP"
          fi
          $SUDO install -o root -g root -m 0644 \
            /tmp/cloud_live_status_sync_V1.py "$CUR/cloud_live_status_sync.py"
          $SUDO install -o root -g root -m 0644 \
            /tmp/futbol24_client_V1.py "$CUR/futbol24_client.py"
          $SUDO install -o root -g root -m 0644 \
            /tmp/sofascore_event_client_V1.py "$CUR/sofascore_event_client.py"
          $SUDO install -o root -g root -m 0644 \
            /tmp/oddshunter-live-sync.service /etc/systemd/system/oddshunter-live-sync.service
          $SUDO install -o root -g root -m 0644 \
            /tmp/oddshunter-live-sync.timer /etc/systemd/system/oddshunter-live-sync.timer

          $SUDO -u oddshunter "$PY" - "$CUR/cloud_live_status_sync.py" <<'PY'
          from pathlib import Path
          import sys
          path=Path(sys.argv[1])
          compile(path.read_text(encoding="utf-8"),str(path),"exec")
          print("LIVE_SYNC_SYNTAX=PASS")
          PY
          echo "LIVE_SYNC_INSTALL=PASS"

          # Run one provider-safe repair batch during deployment. The permanent
          # minute timer rotates through the rest of the recent debt afterwards.
          # Always restore the timer, even if the bootstrap process fails.
          cleanup_bootstrap() {
            $SUDO rm -f /run/systemd/system/oddshunter-live-sync.service.d/bootstrap.conf
            $SUDO systemctl daemon-reload
            $SUDO systemctl enable --now oddshunter-live-sync.timer || true
          }
          trap cleanup_bootstrap EXIT
          $SUDO systemctl stop oddshunter-live-sync.timer || true
          $SUDO systemctl stop oddshunter-live-sync.service || true
          $SUDO install -d -m 0755 /run/systemd/system/oddshunter-live-sync.service.d
          $SUDO tee /run/systemd/system/oddshunter-live-sync.service.d/bootstrap.conf >/dev/null <<'UNIT'
          [Service]
          Environment=ODDSHUNTER_LIVE_NEAR_LIMIT=12
          Environment=ODDSHUNTER_LIVE_OVERDUE_LIMIT=6
          Environment=ODDSHUNTER_LIVE_RECONCILE_HOURS=0
          Environment=ODDSHUNTER_LIVE_RECONCILE_LIMIT=0
          Environment=ODDSHUNTER_LIVE_PRIORITY_EVENT_IDS=16450844,16450879,15353111,15235461
          UNIT

          $SUDO systemctl daemon-reload
          if ! $SUDO systemctl start oddshunter-live-sync.service; then
            $SUDO journalctl -u oddshunter-live-sync.service -n 200 --no-pager
            exit 31
          fi
          $SUDO journalctl -u oddshunter-live-sync.service -n 120 --no-pager
          $SUDO -u oddshunter "$PY" - "$CUR/data/automation/cloud_live_status/last.json" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding="utf-8") as handle:
              report=json.load(handle)
          for item in report.get("events",[]):
              if item.get("reconciliation"):
                  continue
              compact={
                  "event_id":item.get("event_id"), "match":item.get("match"),
                  "result":item.get("result"), "error":item.get("error"),
                  "provider_log":(item.get("provider_log") or [])[-3:],
                  "state":(item.get("snapshot") or {}).get("state"),
              }
              print("TARGET_REPORT =",json.dumps(compact,ensure_ascii=False,separators=(",",":")))
          PY
          cleanup_bootstrap
          trap - EXIT

          test "$($SUDO systemctl is-enabled oddshunter-live-sync.timer)" = "enabled"
          test "$($SUDO systemctl is-active oddshunter-live-sync.timer)" = "active"
          $SUDO systemctl list-timers oddshunter-live-sync.timer --no-pager

          $SUDO -u oddshunter "$PY" - "$DB" <<'PY'
          import sqlite3,sys
          ids=(16629438,16416304,16361896,16416290)
          con=sqlite3.connect(f"file:{sys.argv[1]}?mode=ro",uri=True)
          con.row_factory=sqlite3.Row
          print("quick_check =",con.execute("PRAGMA quick_check").fetchone()[0])
          print("foreign_key_errors =",len(con.execute("PRAGMA foreign_key_check").fetchall()))
          for row in con.execute(
              "SELECT sofascore_id,kickoff,status,home_goals,away_goals "
              "FROM matches WHERE sofascore_id IN (?,?,?,?) ORDER BY sofascore_id",
              ids,
          ):
              print("TARGET_LOCAL =",dict(row))
          con.close()
          PY

          # Discover whether the Vercel frontend source also exists on this
          # host; this is read-only and never prints credentials.
          FRONTEND_MATCHES="$($SUDO grep -RIl --exclude='*.log' --exclude='*.db*' \
            --exclude='*.zip' 'Turso OK · solo lectura' /opt/oddshunter 2>/dev/null | head -20 || true)"
          if [ -n "$FRONTEND_MATCHES" ]; then
            echo "FRONTEND_SOURCE_FOUND=YES"
            printf '%s\n' "$FRONTEND_MATCHES"
          else
            echo "FRONTEND_SOURCE_FOUND=NO"
          fi
          echo "LIVE_TIMER_DEPLOY=PASS"
          REMOTE

      - name: Publicar diagnóstico seguro
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path("live_deploy_evidence.txt")
          if not path.is_file():
              raise SystemExit(0)
          markers=("TARGET_REPORT =",)
          selected=[line.strip() for line in path.read_text(encoding="utf-8",errors="replace").splitlines()
                    if any(marker in line for marker in markers)]
          payload="\n".join(selected[-160:]) or "No filtered live-sync diagnostics were emitted."
          payload=payload[:50000].replace("%","%25").replace("\r","%0D").replace("\n","%0A")
          print(f"::warning title=LIVE_SYNC_DIAGNOSTIC::{payload}")
          PY
      - name: Verificar API móvil
        run: |
          set -eEuo pipefail
          python - <<'PY'
          import json,time,urllib.request
          expected={
              16629468:(1,1), 15353108:(5,1),
          }
          live_targets={16483657,15426912}
          targets=set(expected) | live_targets
          found={}
          for offset in (-2,-1,0):
              url=f"https://oddshunter-mobile.vercel.app/api/day?offset={offset}&limit=1000&cb={time.time_ns()}"
              req=urllib.request.Request(url,headers={"Cache-Control":"no-cache"})
              with urllib.request.urlopen(req,timeout=45) as response:
                  rows=json.load(response)
              for row in rows:
                  if int(row.get("event_id") or 0) in targets:
                      found[int(row["event_id"])]=row
          for event_id in sorted(expected):
              row=found.get(event_id)
              print("TARGET_API =",json.dumps(row,ensure_ascii=False,sort_keys=True))
              if row is None:
                  raise SystemExit(f"API_TARGET_MISSING={event_id}")
              status=str(row.get("status") or "").upper()
              score=(row.get("home_score"),row.get("away_score"))
              if status not in {"FT","FINAL","FINISHED","ENDED","AET","PEN"}:
                  raise SystemExit(f"API_TARGET_NOT_FINAL={event_id}:{status}")
              if score != expected[event_id]:
                  raise SystemExit(f"API_TARGET_WRONG_SCORE={event_id}:{score}")
          for event_id in sorted(live_targets):
              row=found.get(event_id)
              print("LIVE_TARGET_API =",json.dumps(row,ensure_ascii=False,sort_keys=True))
              if row is None:
                  raise SystemExit(f"API_LIVE_TARGET_MISSING={event_id}")
              status=str(row.get("status") or "").upper()
              score=(row.get("home_score"),row.get("away_score"))
              if status not in {"LIVE","INPROGRESS","HT","FT","FINAL","FINISHED","ENDED","AET","PEN"}:
                  raise SystemExit(f"API_LIVE_TARGET_STALE={event_id}:{status}")
              if score[0] is None or score[1] is None:
                  raise SystemExit(f"API_LIVE_TARGET_SCORE_MISSING={event_id}:{score}")
          health_url=f"https://oddshunter-mobile.vercel.app/api/health?cb={time.time_ns()}"
          with urllib.request.urlopen(health_url,timeout=45) as response:
              health=json.load(response)
          print("HEALTH =",health)
          if health.get("ok") is not True or health.get("source") != "turso":
              raise SystemExit("MOBILE_HEALTH_FAIL")
          print("MOBILE_API_VERIFY=PASS")
          PY

      - name: Subir evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oddshunter-live-status-v1-evidence
          path: live_deploy_evidence.txt
          if-no-files-found: ignore
