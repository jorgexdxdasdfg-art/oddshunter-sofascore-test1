name: OddsHunter Stage5 Queue Drain DEPLOY V2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy_fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Construir y validar patch exacto
        run: |
          set -euo pipefail
          : > patch.b64
          printf '%s' '' >> patch.b64
          printf '%s' '' >> patch.b64
          printf '%s' '' >> patch.b64
          printf '%s' '' >> patch.b64
          printf '%s' '' >> patch.b64
          printf '%s' '' >> patch.b64
          printf '%s' '' >> patch.b64
          printf '%s' '' >> patch.b64
          printf '%s' 'ZiBfX25hbWVfXyA9PSAiX19tYWluX18iOgogICAgcmFpc2UgU3lzdGVtRXhpdChtYWluKCkpCg==' >> patch.b64
          base64 -d patch.b64 > cloud_stage5_cycle.py
          rm -f patch.b64

          GOT="$(sha256sum cloud_stage5_cycle.py | awk '{print $1}')"
          test "$GOT" = "b4b93b0edc6e864bafeed77a1b019426c09ce88834d84edf000568bf0abb2cb0"
          python3 -m py_compile cloud_stage5_cycle.py

          echo "PATCH_BUILD=PASS"
          echo "PATCH_SHA256=$GOT"

      - name: Preparar SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_PORT_SECRET: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          test -n "${VPS_HOST:-}"
          test -n "${VPS_SSH_PRIVATE_KEY:-}"

          PORT="${VPS_PORT_SECRET:-22}"
          echo "VPS_PORT=$PORT" >> "$GITHUB_ENV"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/oddshunter_fix
          chmod 600 ~/.ssh/oddshunter_fix
          ssh-keygen -y -f ~/.ssh/oddshunter_fix >/dev/null
          ssh-keyscan -p "$PORT" -H "$VPS_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          echo "SSH_PREP=PASS"

      - name: Copiar patch al VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          test -n "${VPS_USER:-}"

          scp             -i ~/.ssh/oddshunter_fix             -P "$VPS_PORT"             -o BatchMode=yes             -o StrictHostKeyChecking=yes             cloud_stage5_cycle.py             "$VPS_USER@$VPS_HOST:/tmp/oddshunter_cloud_stage5_cycle_RESULT_QUEUE_FIX_V1.py"

          echo "SCP=PASS"

      - name: Backup atomico + aplicar fix + reiniciar servicio
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail

          ssh             -i ~/.ssh/oddshunter_fix             -p "$VPS_PORT"             -o BatchMode=yes             -o StrictHostKeyChecking=yes             "$VPS_USER@$VPS_HOST"             "EXPECTED_ORIGINAL='584f5f6b1ed3787f6bd373bfef836b458339b735e9556c04a3ea70ecf7ae276e' PATCHED_SHA='b4b93b0edc6e864bafeed77a1b019426c09ce88834d84edf000568bf0abb2cb0' bash -s" <<'REMOTE' | tee deploy_evidence.txt
          set -euo pipefail

          if [ "$(id -u)" -eq 0 ]; then
            SUDO=""
          else
            SUDO="sudo -n"
          fi

          CURRENT_DIR="$(readlink -f /opt/oddshunter/current)"
          TARGET="$CURRENT_DIR/cloud_stage5_cycle.py"
          PATCH="/tmp/oddshunter_cloud_stage5_cycle_RESULT_QUEUE_FIX_V1.py"
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          BACKUP="$CURRENT_DIR/cloud_stage5_cycle.py.PRE_RESULT_QUEUE_FIX_V1_$STAMP"

          echo "CURRENT_DIR=$CURRENT_DIR"
          echo "TARGET=$TARGET"

          test -f "$TARGET"
          test -f "$PATCH"

          BEFORE="$(sha256sum "$TARGET" | awk '{print $1}')"
          PATCH_GOT="$(sha256sum "$PATCH" | awk '{print $1}')"

          echo "BEFORE_SHA256=$BEFORE"
          echo "PATCH_SHA256=$PATCH_GOT"

          if [ "$PATCH_GOT" != "$PATCHED_SHA" ]; then
            echo "PATCH_SHA_GATE=FAIL"
            exit 20
          fi

          if [ "$BEFORE" = "$PATCHED_SHA" ]; then
            echo "PATCH_ALREADY_APPLIED=YES"
          else
            if [ "$BEFORE" != "$EXPECTED_ORIGINAL" ]; then
              echo "SOURCE_DRIFT=YES"
              echo "EXPECTED_ORIGINAL=$EXPECTED_ORIGINAL"
              exit 21
            fi

            $SUDO cp -a "$TARGET" "$BACKUP"
            echo "BACKUP=$BACKUP"

            $SUDO install               -o oddshunter               -g oddshunter               -m 0644               "$PATCH"               "$TARGET"

            AFTER="$(sha256sum "$TARGET" | awk '{print $1}')"
            echo "AFTER_SHA256=$AFTER"

            if [ "$AFTER" != "$PATCHED_SHA" ]; then
              echo "INSTALL_SHA_GATE=FAIL"
              $SUDO cp -a "$BACKUP" "$TARGET"
              exit 22
            fi
          fi

          if ! $SUDO -u oddshunter /opt/oddshunter/current/.venv-cloud/bin/python - "$TARGET" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          source = p.read_text(encoding="utf-8")
          compile(source, str(p), "exec")
          print("SYNTAX_COMPILE_IN_MEMORY=PASS")
          PY
          then
            echo "SYNTAX_GATE=FAIL"
            if [ -f "$BACKUP" ]; then
              $SUDO cp -a "$BACKUP" "$TARGET"
            fi
            exit 23
          fi
          echo "SYNTAX_GATE=PASS"

          date +%s | $SUDO tee /tmp/oddshunter_result_queue_fix_v1_restart_epoch >/dev/null
          $SUDO systemctl restart oddshunter.service
          sleep 5

          if [ "$($SUDO systemctl is-active oddshunter.service)" != "active" ]; then
            echo "SERVICE_RESTART=FAIL"
            if [ -f "$BACKUP" ]; then
              $SUDO cp -a "$BACKUP" "$TARGET"
              $SUDO systemctl restart oddshunter.service
            fi
            exit 24
          fi

          echo "SERVICE_RESTART=PASS"
          $SUDO systemctl show oddshunter.service             -p ActiveState             -p SubState             -p MainPID             -p NRestarts             --no-pager

          echo "DEPLOY_FIX=PASS"
          REMOTE

      - name: Esperar primer ciclo post-fix
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          echo "Esperando el primer CYCLE PASS/FAIL posterior al reinicio..."
          FOUND=0
          for i in $(seq 1 32); do
            LINE="$(
              ssh \
                -i ~/.ssh/oddshunter_fix \
                -p "$VPS_PORT" \
                -o BatchMode=yes \
                -o StrictHostKeyChecking=yes \
                "$VPS_USER@$VPS_HOST" '
                  EPOCH=$(cat /tmp/oddshunter_result_queue_fix_v1_restart_epoch 2>/dev/null || echo 0)
                  if [ "$(id -u)" -eq 0 ]; then SUDO=""; else SUDO="sudo -n"; fi
                  $SUDO journalctl -u oddshunter.service --since "@$EPOCH" --no-pager 2>/dev/null \
                    | grep -E "CYCLE=[0-9]+ (PASS|FAIL)" \
                    | tail -n 1 || true
                '
            )"
            if [ -n "$LINE" ]; then
              echo "$LINE"
              FOUND=1
              break
            fi
            sleep 15
          done
          if [ "$FOUND" -ne 1 ]; then
            echo "POST_FIX_CYCLE_WAIT=TIMEOUT"
          else
            echo "POST_FIX_CYCLE_WAIT=FOUND"
          fi

      - name: Evidencia post-fix READ ONLY
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail

          ssh             -i ~/.ssh/oddshunter_fix             -p "$VPS_PORT"             -o BatchMode=yes             -o StrictHostKeyChecking=yes             "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE' | tee post_fix_evidence.txt
          set -u

          if [ "$(id -u)" -eq 0 ]; then
            SUDO=""
          else
            SUDO="sudo -n"
          fi

          echo "================================================================"
          echo "ODDSHUNTER STAGE5 RESULT QUEUE FIX V1 - POST CHECK"
          echo "================================================================"

          echo
          echo "========== SERVICE =========="
          $SUDO systemctl is-active oddshunter.service || true
          $SUDO systemctl show oddshunter.service             -p ActiveState             -p SubState             -p MainPID             -p NRestarts             --no-pager || true

          echo
          echo "========== HEALTH =========="
          if [ -x /usr/local/bin/oddshunter-stage8-health ]; then
            $SUDO /usr/local/bin/oddshunter-stage8-health               --wait-seconds 1               --poll-seconds 1               --json || true
          fi

          echo
          echo "========== STAGE5 REPORT SUMMARY =========="
          REPORT="$(readlink -f /opt/oddshunter/current)/artifacts/cloud_stage5_cycle.json"
          if [ -f "$REPORT" ]; then
            /opt/oddshunter/current/.venv-cloud/bin/python - "$REPORT" <<'PY'
          import json, sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          print("STAGE5_PASS =", d.get("stage5_pass"))
          print("SYNC_CANDIDATE_COUNT =", d.get("sync_candidate_count"))
          print("SYNC_QUEUE_COUNTS =", d.get("sync_queue_counts"))
          print("SELECTED_SYNC_TARGETS =")
          for x in d.get("selected_sync_targets", []):
              print("  ", x.get("competition_key"), x.get("event_id"),
                    x.get("match"), x.get("queue_reason"),
                    x.get("status_db"), x.get("home_goals_db"),
                    x.get("away_goals_db"))
          print("SYNC_RESULT_COUNTS =", d.get("sync_result_counts"))
          print("CRITERIA =", d.get("criteria"))
          PY
          else
            echo "STAGE5_REPORT=NOT_FOUND"
          fi

          echo
          echo "========== TARGET EVENTS =========="
          DB="$(readlink -f /opt/oddshunter/current)/data/oddshunter.db"
          if [ -f "$DB" ]; then
            /opt/oddshunter/current/.venv-cloud/bin/python - "$DB" <<'PY'
          import sqlite3, sys
          ids=(16835069,15285812,16390710)
          con=sqlite3.connect(sys.argv[1])
          con.row_factory=sqlite3.Row
          q="""
          SELECT m.match_id,m.sofascore_id,m.kickoff,m.status,
                 m.home_goals,m.away_goals,
                 h.name home,a.name away
          FROM matches m
          JOIN teams h ON h.team_id=m.home_team_id
          JOIN teams a ON a.team_id=m.away_team_id
          WHERE m.sofascore_id IN (?,?,?)
          ORDER BY m.sofascore_id
          """
          for r in con.execute(q,ids):
              print(dict(r))
          con.close()
          PY
          fi

          echo
          echo "========== JOURNAL POST-FIX =========="
          $SUDO journalctl             -u oddshunter.service             --since "6 minutes ago"             --no-pager             -n 1600             | grep -Eia             "sync_candidate_count|sync_queue_counts|selected_sync_targets|16835069|15285812|16390710|COMMITTED|published_match_ids|SOURCE_UNAVAILABLE|STAGE5_PASS|STAGE6_PASS|ERROR|Traceback"             || true

          echo "POST_FIX_AUDIT_DONE=YES"
          REMOTE

      - name: Subir evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oddshunter-stage5-queue-drain-deploy-v2-evidence
          path: |
            deploy_evidence.txt
            post_fix_evidence.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Gate final
        if: always()
        run: |
          test -f deploy_evidence.txt
          grep -q "DEPLOY_FIX=PASS" deploy_evidence.txt
          echo "FINAL=PASS_STAGE5_QUEUE_DRAIN_DEPLOY_V2"
